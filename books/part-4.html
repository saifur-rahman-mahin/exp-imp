<!DOCTYPE html>
<html lang="bn" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Practical Import–Export Management — চতুর্থ অংশ</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--h:190;--bg:#f3f5f9;--fg:#0f1a2e;--mu:#475569;--card:rgba(255,255,255,.72);--st:rgba(15,26,46,.14);--a:hsl(var(--h) 78% 44%);--at:hsl(var(--h) 80% 30%);--soft:hsl(var(--h) 80% 50%/.14);--grid:rgba(15,26,46,.06);--no:.05;--bo:.45;
--font:'Noto Sans Bengali','Solaimanlipi','Kalpurush','Nikosh','Vrinda','Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;--side:300px;--top:56px;--bot:64px}
:root[data-theme=dark]{--bg:#070d1a;--fg:#e8eefc;--mu:#a8b4d0;--card:rgba(255,255,255,.055);--st:rgba(255,255,255,.14);--a:hsl(var(--h) 85% 62%);--at:hsl(var(--h) 90% 72%);--soft:hsl(var(--h) 85% 60%/.16);--grid:rgba(255,255,255,.05);--no:.07;--bo:.5}
*,*::before,*::after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px;-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--font);font-size:clamp(1rem,.95rem + .3vw,1.125rem);line-height:1.8;overflow-x:clip;min-height:100dvh;transition:background .5s,color .5s}
body.lock{overflow:hidden}
button,input{font-family:inherit;font-size:inherit;color:inherit}
:focus-visible{outline:3px solid var(--a);outline-offset:3px;border-radius:8px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
#splash{position:fixed;inset:0;z-index:3000;display:grid;place-items:center;background:var(--bg);transition:opacity .7s,visibility .7s;text-align:center}
#splash.off{opacity:0;visibility:hidden;pointer-events:none}
.sp-box{width:70px;height:70px;margin:0 auto 1rem;border:4px solid var(--st);border-top-color:var(--a);border-radius:50%;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.blob{position:absolute;border-radius:50%;filter:blur(80px);opacity:var(--bo);will-change:transform}
.b1{width:46vmax;height:46vmax;left:-14vmax;top:-12vmax;background:radial-gradient(circle,hsl(var(--h) 85% 55%/.8),transparent 68%);animation:d1 30s ease-in-out infinite alternate}
.b2{width:40vmax;height:40vmax;right:-12vmax;top:20vh;background:radial-gradient(circle,hsl(calc(var(--h) + 70) 80% 58%/.65),transparent 68%);animation:d1 38s ease-in-out infinite alternate-reverse}
.b3{width:36vmax;height:36vmax;left:25vw;bottom:-16vmax;background:radial-gradient(circle,hsl(calc(var(--h) - 60) 85% 55%/.5),transparent 68%);animation:d1 44s ease-in-out infinite alternate}
@keyframes d1{to{transform:translate(8vmax,6vmax) scale(1.15)}}
.grid{position:absolute;inset:0;background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:56px 56px;-webkit-mask-image:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 78%);mask-image:radial-gradient(ellipse at 50% 30%,#000 15%,transparent 78%)}
.noise{position:absolute;inset:0;opacity:var(--no);background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
#pc{position:absolute;inset:0;width:100%;height:100%}
#glow{position:fixed;left:0;top:0;width:340px;height:340px;margin:-170px 0 0 -170px;border-radius:50%;background:radial-gradient(circle,hsl(var(--h) 85% 60%/.18),transparent 65%);pointer-events:none;z-index:1;opacity:0;transition:opacity .3s}
.top{position:fixed;left:0;right:0;top:0;height:calc(var(--top) + env(safe-area-inset-top));padding:env(safe-area-inset-top) 1rem 0;z-index:100;display:flex;align-items:center;gap:.75rem;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--st)}
.top b{font-size:.95rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.top small{color:var(--mu);white-space:nowrap}
#prog{position:absolute;left:0;bottom:-1px;height:3px;width:0;background:linear-gradient(90deg,var(--a),hsl(calc(var(--h) + 60) 85% 60%))}
.ib{min-width:48px;min-height:48px;display:inline-grid;place-items:center;border:1px solid var(--st);background:var(--card);border-radius:14px;cursor:pointer;line-height:1;padding:0 .6rem}
.ib:hover{border-color:var(--a)}
#side{position:fixed;left:0;top:calc(var(--top) + env(safe-area-inset-top));bottom:0;width:var(--side);overflow:auto;padding:1rem;z-index:50;display:none;border-right:1px solid var(--st);background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.toc{list-style:none;margin:0;padding:0}
.toc a{display:flex;gap:.6rem;align-items:baseline;min-height:48px;padding:.45rem .7rem;border-radius:12px;color:var(--mu);text-decoration:none;font-size:.92rem;line-height:1.45;align-items:center;border-left:3px solid transparent}
.toc a b{min-width:1.6rem;color:var(--at)}
.toc a:hover,.toc a.on{background:var(--soft);color:var(--fg);border-left-color:var(--a)}
#mm{position:fixed;inset:0;z-index:500;background:var(--bg);transform:translateX(100%);transition:transform .4s cubic-bezier(.2,.8,.2,1);overflow:auto;padding:calc(env(safe-area-inset-top) + 1rem) 1rem calc(var(--bot) + 2rem);visibility:hidden}
#mm.open{transform:none;visibility:visible}
#mm h2{margin:.2rem 0 1rem;font-size:1.2rem}
.bot{position:fixed;left:0;right:0;bottom:0;z-index:100;height:calc(var(--bot) + env(safe-area-inset-bottom));padding:0 .5rem env(safe-area-inset-bottom);display:flex;justify-content:space-around;align-items:center;background:var(--card);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--st)}
.bot .ib{border:0;background:none;font-size:.78rem;flex-direction:column;gap:2px;flex:1;min-height:52px}
main{position:relative;z-index:2;padding:calc(var(--top) + env(safe-area-inset-top) + 1rem) 1rem calc(var(--bot) + 3rem)}
.wrap{max-width:900px;margin:0 auto}
.hero{display:grid;gap:1.5rem;min-height:calc(100dvh - 90px);align-content:center;padding:1.5rem 0}
.kick{color:var(--at);letter-spacing:.12em;font-size:.82rem;font-weight:700}
h1{font-size:clamp(1.9rem,1.3rem + 3.4vw,3.4rem);line-height:1.25;margin:.4rem 0 .8rem}
h1 span,h2 .w{display:inline-block}
.sub{color:var(--mu);max-width:60ch}
.typ{min-height:2.2em;font-weight:700;color:var(--at);font-size:1.1rem}
.typ::after{content:"|";animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
#globe{width:100%;max-width:440px;aspect-ratio:1;margin:0 auto}
#globe canvas,#globe svg{width:100%;height:100%;display:block;touch-action:pan-y}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;margin:1rem 0}
.stat{padding:.8rem 1rem;border:1px solid var(--st);border-radius:16px;background:var(--card);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.stat b{display:block;font-size:1.7rem;color:var(--at);line-height:1.2}
.stat small{color:var(--mu)}
.btns{display:flex;flex-wrap:wrap;gap:.7rem}
.btn{position:relative;overflow:hidden;min-height:48px;padding:.6rem 1.3rem;border-radius:99px;border:1px solid var(--a);background:var(--soft);cursor:pointer;font-weight:700;text-decoration:none;color:var(--fg);display:inline-flex;align-items:center;transition:transform .15s}
.btn.p{background:var(--a);color:#06101f}
.rp{position:absolute;border-radius:50%;background:rgba(255,255,255,.5);transform:scale(0);animation:rp .6s linear;pointer-events:none}
@keyframes rp{to{transform:scale(4);opacity:0}}
.card{position:relative;margin:1.2rem 0;padding:1.2rem 1.2rem 1rem;border:1px solid var(--st);border-radius:22px;background:var(--card);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);transform-style:preserve-3d;transition:border-color .3s,box-shadow .3s}
.card:hover{border-color:var(--a);box-shadow:0 18px 50px -22px var(--a)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:radial-gradient(260px circle at var(--mx,50%) var(--my,0%),hsl(0 0% 100%/.12),transparent 60%);opacity:0;transition:opacity .3s}
.card:hover::after{opacity:1}
.card h3{margin:0 0 .6rem;font-size:clamp(1.1rem,1rem + .6vw,1.4rem);color:var(--at);line-height:1.5}
.note h3{margin-top:0}
p{margin:.7rem 0;overflow-wrap:anywhere}
ul.ul,ul.ol{margin:.7rem 0;padding:0;list-style:none}
ul.ul li,ul.ol li{position:relative;padding:.25rem 0 .25rem 1.6rem;overflow-wrap:anywhere}
ul.ul li::before{content:"";position:absolute;left:.35rem;top:1.1em;width:.5rem;height:.5rem;border-radius:50%;background:var(--a)}
ul.ol li{padding-left:.2rem;border-left:3px solid var(--a);padding-left:.8rem;margin:.35rem 0;background:var(--soft);border-radius:0 10px 10px 0}
.tw{overflow-x:auto}
table{border-collapse:collapse;width:100%}
th,td{padding:.6rem .8rem;border:1px solid var(--st);text-align:left}
th{background:var(--soft)}
.chap{position:relative;padding:2rem 0 1rem}
.chap>header{display:flex;gap:1rem;align-items:center;margin-bottom:.8rem}
.num{flex:none;width:3.4rem;height:3.4rem;border-radius:18px;display:grid;place-items:center;font-weight:800;font-size:1.4rem;background:var(--a);color:#06101f}
h2{margin:0;font-size:clamp(1.4rem,1.1rem + 1.8vw,2.3rem);line-height:1.35}
.wave{display:block;width:100%;height:56px;color:var(--a);opacity:.25;margin-top:1.5rem}
.calc{display:grid;gap:1rem}
.fld{display:grid;gap:.2rem;font-size:.9rem;color:var(--mu);min-width:0;overflow-wrap:anywhere}
.fld input{width:100%;min-width:0;min-height:48px;padding:.4rem .8rem;border-radius:12px;border:1px solid var(--st);background:var(--bg);color:var(--fg)}
.fg{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem;align-items:end}
.res{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem}
.res div{min-width:0;padding:.6rem .8rem;border-radius:14px;background:var(--soft)}
.res b{display:block;color:var(--at);font-size:1.15rem}
.dn{display:grid;gap:1rem;justify-items:center}
.dn svg{width:220px;height:220px}
.dn circle{transition:stroke-dasharray .6s,stroke-dashoffset .6s;cursor:pointer}
.lg{list-style:none;margin:0;padding:0;width:100%;font-size:.88rem}
.lg li{display:flex;gap:.5rem;align-items:center;padding:.15rem 0}
.lg i{width:.8rem;height:.8rem;border-radius:3px;flex:none}
#tip{position:fixed;z-index:900;pointer-events:none;padding:.4rem .7rem;border-radius:10px;background:#0b1224;color:#fff;font-size:.85rem;opacity:0;transition:opacity .15s;border:1px solid var(--a)}
#totop{position:fixed;right:1rem;bottom:calc(var(--bot) + env(safe-area-inset-bottom) + .8rem);z-index:90;opacity:0;pointer-events:none;transition:opacity .3s}
#totop.show{opacity:1;pointer-events:auto}
#pal{position:fixed;inset:0;z-index:800;display:none;align-items:flex-start;justify-content:center;padding:calc(env(safe-area-inset-top) + 8vh) 1rem 1rem;background:rgba(3,8,20,.6);backdrop-filter:blur(6px)}
#pal.open{display:flex}
.pb{width:min(680px,100%);max-height:80dvh;display:flex;flex-direction:column;border-radius:22px;border:1px solid var(--st);background:var(--bg);box-shadow:0 30px 80px -20px #000;overflow:hidden}
#pq{width:100%;border:0;border-bottom:1px solid var(--st);background:none;padding:1rem 1.2rem;min-height:56px;outline:none}
#pr{list-style:none;margin:0;padding:.4rem;overflow:auto}
#pr li{padding:.6rem .8rem;border-radius:12px;cursor:pointer;min-height:48px;font-size:.92rem;line-height:1.5}
#pr li small{display:block;color:var(--at);font-weight:700}
#pr li.sel,#pr li:hover{background:var(--soft)}
mark{background:hsl(var(--h) 90% 55%/.45);color:inherit;border-radius:4px;padding:0 2px}
@media(min-width:480px){.stats{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(min-width:768px){main{padding-left:2rem;padding-right:2rem}.dn{grid-template-columns:220px 1fr}.fg{grid-template-columns:repeat(3,minmax(0,1fr))}.res{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:767px){table,tbody,tr,td,th{display:block}thead{display:none}tr{margin:.5rem 0;border:1px solid var(--st);border-radius:12px;overflow:hidden}td::before,th::before{content:attr(data-l) ": ";color:var(--at);font-weight:700}}
@media(min-width:1024px){#side{display:block}.bot,#mm,#mmo{display:none}main{margin-left:var(--side)}.hero{grid-template-columns:minmax(0,1.1fr) minmax(0,.9fr)}.top{padding-left:calc(var(--side) + 1rem)}}
@media(min-width:1440px){.wrap{max-width:980px}}
@media(hover:none){#glow{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{#bg,#glow,.top,#side,.bot,#splash,#globe,.wave,#pal,#mm,#totop,.btns{display:none!important}body{background:#fff;color:#000}main{margin:0;padding:0}.card{background:none;border:1px solid #999;break-inside:avoid;backdrop-filter:none}.card h3,.kick,.typ,.stat b{color:#000}.hero{min-height:0}}
.ic{width:1.35rem;height:1.35rem;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
.num .ic{width:1.8rem;height:1.8rem}
.toc a b .ic{width:1.1rem;height:1.1rem}
.bot .ib .ic{width:1.3rem;height:1.3rem}
</style>
</head>
<body>
<div id="splash" role="status"><div><div class="sp-box"></div><b>THE COMPLETE IMPORT–EXPORT HANDBOOK</b><div style="color:var(--mu)">চতুর্থ অংশ লোড হচ্ছে…</div></div></div>
<div id="bg" aria-hidden="true"><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="grid"></div><div class="noise"></div><canvas id="pc"></canvas></div>
<div id="glow" aria-hidden="true"></div>
<header class="top"><button class="ib" id="mmo" aria-label="সূচিপত্র খুলুন"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button><b>Practical Import–Export Management</b><small id="rt"></small><button class="ib" id="srch" aria-label="সার্চ (Ctrl+K)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg></button><button class="ib" id="thm" aria-label="থিম বদলান (T)"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg></button><div id="prog"></div></header>
<nav id="side" aria-label="সূচিপত্র"><ol class="toc" id="toc"></ol></nav>
<div id="mm" role="dialog" aria-modal="true" aria-label="সূচিপত্র"><div style="display:flex;justify-content:space-between;align-items:center"><h2>সূচিপত্র</h2><button class="ib" id="mmc" aria-label="বন্ধ করুন"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div><ol class="toc" id="toc2"></ol></div>
<nav class="bot" aria-label="দ্রুত নেভিগেশন"><button class="ib" id="b1"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 6h16M4 12h16M4 18h16"/></svg><span>সূচি</span></button><button class="ib" id="b2"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><span>সার্চ</span></button><button class="ib" id="b3"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="9"/><path d="M12 3v18a9 9 0 0 0 0-18z" fill="currentColor"/></svg><span>থিম</span></button><button class="ib" id="b4"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg><span>উপরে</span></button></nav>
<button class="ib" id="totop" aria-label="উপরে যান"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
<div id="pal" role="dialog" aria-modal="true" aria-label="সার্চ"><div class="pb"><input id="pq" type="search" placeholder="সার্চ করুন… (Esc বন্ধ)" autocomplete="off"><ul id="pr" role="listbox"></ul></div></div>
<div id="tip" role="tooltip"></div>
<main id="main"><div class="wrap" id="app"></div></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/ScrollTrigger.min.js"></script>

<script>

h Conversion Cycle"}, {"t": "p", "x": "একটি সাধারণ ব্যবসায় cash প্রথমে supplier বা production-এ যায়, তারপর inventory হয়, এরপর বিক্রি হয়, তারপর customer payment আসে। এই সময়কাল যত দীর্ঘ হবে, working capital-এর প্রয়োজন তত বেশি।"}, {"t": "p", "x": "Cash Conversion Cycle (সহজ ধারণা) = Inventory Days + Receivable Days − Payable Days। Import Business-এ international lead time, customs clearance এবং warehouse processing-এর সময়ও operational cash planning-এ ধরতে হবে।"}, {"t": "h3", "x": "৪.২ Payment Milestone"}, {"t": "p", "x": "Supplier-এর সঙ্গে payment schedule হতে পারে:"}, {"t": "ul", "x": ["Order confirmation-এর সময় deposit", "Production milestone-এ partial payment", "Inspection pass বা cargo-ready হওয়ার পর balance", "LC at sight বা agreed documentary credit arrangement"]}, {"t": "p", "x": "এগুলো উদাহরণ, কোনো বাধ্যতামূলক standard নয়। পণ্যের ধরন, supplier history, bargaining power, transaction size এবং payment method অনুযায়ী শর্ত নির্ধারণ করুন। Advance payment বেশি হলে buyer-এর risk বাড়ে; আবার supplier-এর raw material procurement-এর জন্য advance প্রয়োজন হতে পারে। Balance payment-এর আগে inspection এবং shipping document-এর শর্ত লিখিতভাবে ঠিক করা দরকার।"}, {"t": "h3", "x": "৪.৩ LC, TT ও Documentary Risk"}, {"t": "p", "x": "TT বা bank transfer দ্রুত হতে পারে, কিন্তু টাকা পাঠানোর পর recovery কঠিন হতে পারে। LC-তে bank undertaking থাকে, তবে bank সাধারণত documents পরীক্ষা করে; পণ্য বাস্তবে buyer-এর প্রত্যাশা অনুযায়ী কি না তা সরাসরি যাচাই করে না। তাই LC-কে quality guarantee মনে করা ভুল। LC terms, latest shipment date, expiry, presentation period, required documents এবং discrepancy handling আগে থেকেই bank-এর সঙ্গে যাচাই করুন।"}, {"t": "h3", "x": "৪.৪ Working Capital Plan"}, {"t": "p", "x": "প্রতিটি shipment-এর জন্য cash requirement timeline তৈরি করুন:"}, {"t": "tb", "x": [["Date", "Payment/Expense", "Amount", "Currency", "Payee", "Due Date", "Status", "Evidence"]]}, {"t": "p", "x": "এতে বোঝা যাবে কোন সপ্তাহে কত cash দরকার। একই সময়ে একাধিক shipment থাকলে consolidated cash forecast তৈ : "প্রতি shipment শেষে provider review করুন:"}, {"t": "ul", "x": ["Quotation accuracy", "Milestone update-এর সময়", "Document error", "Clearance/transport coordination", "Unplanned charges", "Problem resolution", "Evidence ও receipt completeness"]}]}, {"n": "✦", "t": "অধ্যায় ১২: Warehouse, Inventory ও Stock Management", "blocks": [{"t": "p", "x": "পণ্য warehouse-এ পৌঁছালেই কাজ শেষ নয়। Quantity, condition, SKU, batch, serial number, expiry date, carton condition এবং storage requirement যাচাই করতে হয়। Warehouse record দুর্বল হলে shortage, misplacement, obsolete stock ও financial loss হতে পারে।"}, {"t": "h3", "x": "১২.১ Goods Receiving"}, {"t": "p", "x": "পণ্য আসার সময়:"}, {"t": "ul", "x": ["Delivery note ও PO মিলিয়ে নিন", "Carton/package count যাচাই করুন", "Seal বা packaging damage থাকলে ছবি তুলুন", "Visible damage ও shortage লিখিতভাবে উল্লেখ করুন", "প্রয়োজনমতো joint inspection করুন", "Serial/batch/lot number record করুন", "GRN (Goods Received Note) তৈরি করুন", "QC clearance না হওয়া পর্যন্ত stock-কে available-for-sale দেখাবেন না"]}, {"t": "h3", "x": "১২.২ Inventory Status"}, {"t": "p", "x": "Stock status আলাদা রাখা যায়:"}, {"t": "ul", "x": ["In Transit", "Arrived, Not Cleared", "Cleared, Not Delivered", "Received, QC Pending", "Available", "Reserved", "Damaged/Quarantine", "Returned", "Obsolete"]}, {"t": "p", "x": "এতে sales team ভুল করে অনুপস্থিত বা blocked stock বিক্রি করবে না।"}, {"t": "h3", "x": "১২.৩ FIFO ও FEFO"}, {"t": "p", "x": "FIFO (First In, First Out) অনুযায়ী আগে আসা stock আগে ছাড়ে। FEFO (First Expired, First Out) expiry-sensitive পণ্যে আগে expiry হবে এমন stock আগে ছাড়ে। কোন পদ্ধতি প্রযোজ্য তা product characteristics অনুযায়ী নির্ধারণ করুন।"}, {"t": "h3", "x": "১২.৪ Reorder Point"}, {"t": "p", "x": "Reorder Point = Average Daily Demand × Lead Time + Safety Stock।"}, {"t": "p", "x": "এটি একটি planning formula। Demand ও lead time পরিবর্তনশীল হলে নিয়মিত update করতে হবে। Import lead time-এ production, booking, sailing, customs এবং inland delivery যুক্ত করুন।"}, in, insurance document, inspection certificate, export declaration এবং product-specific certificate লাগতে পারে। সব document সব shipment-এ লাগে না। Destination country, product এবং payment method অনুযায়ী requirement যাচাই করুন।"}, {"t": "h3", "x": "১৩.৬ Buyer Communication"}, {"t": "p", "x": "Production update, inspection result, booking confirmation, departure, ETA এবং document dispatch-এর সময় buyer-কে update দিন। সমস্যা গোপন না করে impact ও recovery plan জানান। সময়মতো খারাপ খবর জানানো শেষ মুহূর্তের surprise-এর চেয়ে ভালো।"}]}, {"n": "✦", "t": "অধ্যায় ১৪: Sales, Distribution ও Customer Service", "blocks": [{"t": "p", "x": "Import করা পণ্য বিক্রি না হলে cash inventory-তে আটকে থাকে। তাই sourcing ও logistics plan-কে sales plan-এর সঙ্গে যুক্ত করতে হবে। Order দেওয়ার আগে target customer, distribution channel, pricing, promotion, credit policy এবং return policy নির্ধারণ করুন।"}, {"t": "h3", "x": "১৪.১ Channel Strategy"}, {"t": "p", "x": "সম্ভাব্য channel:"}, {"t": "ul", "x": ["Wholesale/distributor", "Retail shop", "Direct-to-consumer e-commerce", "Marketplace", "Corporate/B2B sales", "Project-based supply", "Dealer network"]}, {"t": "p", "x": "একই পণ্যের channel অনুযায়ী margin, payment term, packaging এবং service requirement আলাদা হতে পারে।"}, {"t": "h3", "x": "১৪.২ Customer Promise"}, {"t": "p", "x": "Customer-কে delivery date, warranty, availability এবং product specification সম্পর্কে বাস্তবসম্মত প্রতিশ্রুতি দিন। Supplier-এর estimated date-কে নিশ্চিত date হিসেবে বিক্রি করবেন না।"}, {"t": "h3", "x": "১৪.৩ Return ও Warranty"}, {"t": "p", "x": "কোন defect গ্রহণযোগ্য, কত দিনের মধ্যে claim করা যাবে, ছবি/video বা serial number লাগবে কি না, repair/replacement/refund-এর নিয়ম কী—এসব policy আগে থেকে তৈরি করুন। Supplier-এর warranty এবং end-customer-এর warranty একই নাও হতে পারে। এই gap-এর financial risk importer-কে বহন করতে হতে পারে।"}, {"t": "h3", "x": "১৪.৪ Customer Complaint Analysis"}, {"t": "p", "x": "Complaint-কে শুধু refund request হিসেবে না দেখে root cause analysis করুন। Product defect, wrong description, packaging damage, transport damage, installation issue বা customer misuse—কারণ আলাদা করুন। একই complaint বারবার হলে supplier specification, inspection বা packaging পরিবর্তন করুন।"}]}, {"n": "✦", "t": "অধ্যায় ১৫: Risk Management, Fraud Prevention ও Business Continuity", "blocks": [{"t": "p", "x": "International trade-এ risk পুরোপুরি দূর করা যায় না। লক্ষ্য হলো risk শনাক্ত করা, তার probability ও impact বোঝা, mitigation plan রাখা এবং ঘটলে দ্রুত response দেওয়া।"}, {"t": "h3", "x": "১৫.১ Risk Register"}, {"t": "tb", "x": [["Risk", "Probability", "Impact", "Early Warning", "Preventive Control", "Contingency", "Owner"]]}, {"t": "p", "x": "উদাহরণ:"}, {"t": "ul", "x": ["Supplier fraud: bank detail change request, unusual urgency", "Quality failure: sample ও mass production-এর অমিল", "Shipment delay: cargo-ready date পিছিয়ে যাওয়া", "Customs hold: incorrect description বা missing permit", "Cash shortage: একসঙ্গে একাধিক বড় payment due", "Currency movement: long quotation validity", "Cargo damage: weak packaging বা poor loading"]}, {"t": "h3", "x": "১৫.২ Payment Fraud"}, {"t": "p", "x": "Supplier-এর bank account হঠাৎ পরিবর্তনের email এলে একই email thread-এ reply করে নিশ্চিত হবেন না। পরিচিত ও আগে যাচাইকৃত phone number বা independent channel-এ supplier-এর authorized contact-কে call করে confirm করুন। Beneficiary name mismatch হলে bank ও compliance team-এর অনুমোদন ছাড়া payment করবেন না। Email spoofing এবং compromised mailbox বাস্তব ঝুঁকি।"}, {"t": "h3", "x": "১৫.৩ Document Fraud"}, {"t": "p", "x": "Fake certificate, altered invoice, forged inspection report বা fabricated tracking update হতে পারে। Issuer-এর official channel দিয়ে verification করুন। PDF-এ logo থাকলেই document genuine হয় না।"}, {"t": "h3", "x": "১৫.৪ Sanctions ও Restricted Goods"}, {"t": "p", "x": "Buyer, seller, bank, vessel, country, end user এবং product-এর ওপর applicable sanctions/export-control restriction থাকতে পারে। Product description গোপন করে বা ভুল HS code দিয়ে restriction এড়ানোর চেষ্টা করা বেআইনি ও বিপজ্জনক। প্রয়োজন হলে qualified compliance professional-এর পরামর্শ নিন।"}, {"t": "h3", "x": "১৫.৫ Business Continuity"}, {"t": "p", "x": "প্রধান supplier বন্ধ, port disruption, system outage, staff absence বা transport interruption হলে কীভাবে ব্যবসা চালু থাকবে তার plan রাখুন। Backup supplier, alternate route, backup document access, emergency contact, cash reserve এবং customer communication template তৈরি করুন।"}]}, {"n": "✦", "t": "অধ্যায় ১৬: Dispute, Claim, Insurance ও Recovery", "blocks": [{"t": "p", "x": "Dispute হলে আবেগের বদলে evidence, timeline এবং contract-এর ভিত্তিতে কাজ করুন। Supplier, forwarder, carrier, insurer, C&F বা transporter—কার বিরুদ্ধে claim হবে তা loss-এর cause এবং contractual responsibility অনুযায়ী নির্ধারণ করতে হবে।"}, {"t": "h3", "x": "১৬.১ Claim Evidence"}, {"t": "ul", "x": ["PO/contract ও specification", "Commercial invoice ও packing list", "Inspection report", "Loading/unloading photos", "Container seal record", "Delivery note ও GRN", "Damage/shortage report", "Carrier/terminal exception record", "Correspondence ও notice", "Repair/replacement cost estimate"]}, {"t": "h3", "x": "১৬.২ Cargo Insurance"}, {"t": "p", "x": "Cargo insurance-এর coverage, insured value, route, conveyance, exclusions, deductible, claims procedure এবং notice requirement বুঝে policy নিন। Institute Cargo Clauses-এর মতো wording policy অনুযায়ী ভিন্ন coverage দিতে পারে। “All risks” কথাটি সব ধরনের loss cover করে না; exclusions থাকে।"}, {"t": "h3", "x": "১৬.৩ Damage হলে করণীয়"}, {"t": "p", "x": "পণ্য বা container damage দেখা গেলে delivery receipt-এ reservation/remark দেওয়া সম্ভব কি না দেখুন, ছবি তুলুন, seal ও package evidence সংরক্ষণ করুন, carrier/terminal/insurer-কে policy ও contract অনুযায়ী দ্রুত notice দিন। ক্ষতিগ্রস্ত পণ্য ফেলে দেওয়া বা repair করার আগে insurer/surveyor-এর instruction নিন, যদি তাৎক্ষণিক safety issue না থাকে। Claim deadline মিস করবেন না।"}, {"t": "h3", "x": "১৬.৪ Root Cause ও Corrective Action"}, {"t": "p", "x": "Claim settlement পেলেই সমস্যা শেষ নয়। কেন ক্ষতি হলো—packaging, loading, moisture, handling, temperature, supplier quality, route বা documentation—তা বিশ্লেষণ করুন। Corrective and Preventive Action (CAPA) নির্ধারণ করে পরবর্তী shipment-এ প্রয়োগ করুন।"}]}, {"n": "✦", "t": "অধ্যায় ১৭: Team, SOP, KPI ও Internal Control", "blocks": [{"t": "p", "x": "ব্যবসা বড় হলে ব্যক্তির স্মৃতি ও chat history-এর ওপর নির্ভর করে কাজ চালানো যায় না। SOP (Standard Operating Procedure) কাজের নির্দিষ্ট পদ্ধতি, দায়িত্ব, approval, record এবং exception handling নির্ধারণ করে। SOP খুব জটিল হলে কর্মীরা ব্যবহার করবে না; তাই প্রয়োজন অনুযায়ী ছোট, পরিষ্কার এবং বাস্তবসম্মত রাখুন।"}, {"t": "h3", "x": "১৭.১ SOP-এর কাঠামো"}, {"t": "ul", "x": ["Purpose: কেন এই process দরকার", "Scope: কোন কাজ/পণ্য/department-এর জন্য", "Owner: কে accountable", "Inputs: কী তথ্য/document লাগবে", "Steps: কাজের ধাপ", "Approval: কে অনুমোদন দেবেন", "Output: কী deliverable তৈরি হবে", "Records: কী evidence রাখতে হবে", "Exception: সমস্যা হলে কী করতে হবে", "Revision: version ও effective date"]}, {"t": "h3", "x": "১৭.২ Segregation of Duties"}, {"t": "p", "x": "যিনি supplier তৈরি বা bank details পরিবর্তন করবেন, তিনি একাই payment approve করবেন না। যিনি purchase order তৈরি করেন, তিনি একাই final payment release করবেন না। ছোট প্রতিষ্ঠানে staff কম থাকলে owner বা second reviewer দিয়ে compensating control তৈরি করুন।"}, {"t": "h3", "x": "১৭.৩ KPI"}, {"t": "ul", "x": ["On-time supplier delivery rate", "Inspection pass rate", "Document error rate", "Booking-to-departure variance", "ETA-to-ATA variance", "Customs clearance cycle time", "Port/terminal dwell time", "Unplanned cost per shipment", "Landed-cost variance", "Inventory accuracy", "Stock-out rate", "Customer return/complaint rate", "Supplier claim recovery rate"]}, {"t": "p", "x": "KPI-এর definition স্থির না থাকলে বিভিন্ন মাসের তুলনা অর্থহীন হয়। যেমন “on-time delivery” বলতে supplier cargo-ready date, vessel departure, port arrival নাকি warehouse delivery বোঝানো হচ্ছে—তা নির্দিষ্ট করুন।"}, {"t": "h3", "x": "১৭.৪ Weekly Operations Review"}, {"t": "p", "x": "প্রতি সপ্তাহে চলমান shipment, overdue milestone, upcoming payment, document gap, free-time expiry, customs hold, warehouse receiving এবং customer commitment review করুন। Meeting শেষে action, owner এবং due date লিখুন।"}]}, {"n": "✦", "t": "অধ্যায় ১৮: Digital Tools, Data ও Trade Operations Dashboard", "blocks": [{"t": "p", "x": "শুরুতে spreadsheet দিয়ে অনেক কাজ করা যায়। ব্যবসা বাড়লে shared database, ERP, inventory system, accounting software, document management এবং shipment tracking platform প্রয়োজন হতে পারে। Tool নির্বাচন করার আগে process পরিষ্কার করুন; খারাপ process-কে software দিয়ে automate করলে ভুল দ্রুত ছড়ায়।"}, {"t": "h3", "x": "১৮.১ Minimum Digital Setup"}, {"t": "ul", "x": ["Supplier Master", "Product/SKU Master", "Customer Master", "Purchase Order Register", "Shipment Register", "Payment Schedule", "Document Register", "Landed Cost Sheet", "Inventory Register", "Claim Register"]}, {"t": "h3", "x": "১৮.২ Unique ID"}, {"t": "p", "x": "Supplier ID, Product ID, PO ID, Shipment ID এবং Invoice ID আলাদা রাখুন। একই নামের supplier বা একই product-এর একাধিক model থাকলে শুধু নাম দিয়ে record খোঁজা ঝুঁকিপূর্ণ।"}, {"t": "h3", "x": "১৮.৩ Dashboard"}, {"t": "p", "x": "একটি management dashboard-এ দেখানো যেতে পারে:"}, {"t": "ul", "x": ["Open orders", "Production delayed", "Cargo ready but not booked", "In-transit shipments", "Upcoming ETA", "Customs pending", "Free-time expiry approaching", "Payment due next 7/14 days", "Unreconciled provider bills", "Landed-cost variance", "Inventory below reorder point"]}, {"t": "h3", "x": "১৮.৪ Data Security"}, {"t": "p", "x": "Role-based access, strong password, multi-factor authentication, regular backup, secure document sharing এবং staff offboarding process রাখুন। Bank statement, passport, trade licence, customer data ও commercial contract অপ্রয়োজনে public link-এ রাখবেন না। Shared spreadsheet-এ edit history ও permission review করুন।"}, {"t": "h3", "x": "১৮.৫ Automation-এর সীমা"}, {"t": "p", "x": "Automated tracking notification ভুল বা stale data দিতে পারে। Customs status, payment confirmation, vessel event বা delivery proof-এর মতো গুরুত্বপূর্ণ তথ্য authoritative source দিয়ে verify করুন। Automation human approval-এর বিকল্প নয়, বিশেষত payment, customs declaration এবং contractual commitment-এর ক্ষেত্রে।"}]}, {"n": "✦", "t": "অধ্যায় ১৯: ছোট Importer থেকে Scalable Business", "blocks": [{"t": "p", "x": "ছোট পরিসরে Import শুরু করলে প্রথম লক্ষ্য হওয়া উচিত process শেখা, supplier ও service provider যাচাই, প্রকৃত landed cost বোঝা এবং customer demand প্রমাণ করা। দ্রুত বড় হওয়ার চেয়ে repeatable process তৈরি করা বেশি গুরুত্বপূর্ণ।"}, {"t": "h3", "x": "১৯.১ Pilot Shipment"}, {"t": "p", "x": "Pilot shipment-এর scope সীমিত রাখুন। Product specification, quantity, packaging, supplier, freight mode এবং delivery route যতটা সম্ভব নিয়ন্ত্রিত রাখুন। প্রতিটি ধাপে actual time ও cost record করুন। Pilot শেষে planned বনাম actual তুলনা করে SOP update করুন।"}, {"t": "h3", "x": "১৯.২ Scale-up Gate"}, {"t": "p", "x": "বড় order দেওয়ার আগে কয়েকটি gate পূরণ করুন:"}, {"t": "ul", "x": ["Demand evidence আছে", "Product compliance যাচাই হয়েছে", "Supplier verified", "Sample/inspection approved", "Landed cost ও margin গ্রহণযোগ্য", "Cash-flow plan প্রস্তুত", "Freight ও customs route নিশ্চিত", "Backup plan আছে", "Customer/warehouse readiness আছে"]}, {"t": "h3", "x": "১৯.৩ Supplier Negotiation-এর উন্নতি"}, {"t": "p", "x": "Repeat order volume, forecast visibility, consolidated purchase এবং payment discipline দিয়ে better terms আলোচনা করা যায়। কিন্তু কেবল কম দাম পেতে specification কমিয়ে দিলে long-term reputation নষ্ট হতে পারে। Price reduction-এর বিনিময়ে quality, packaging বা service level কমছে কি না দেখুন।"}, {"t": "h3", "x": "১৯.৪ Service Provider Network"}, {"t": "p", "x": "প্রতিটি গুরুত্বপূর্ণ service-এর primary ও backup provider রাখুন। তবে একই কাজের জন্য অকারণে অনেক agent তৈরি করলে coordination cost বাড়ে। Provider performance data দিয়ে সিদ্ধান্ত নিন।"}, {"t": "h3", "x": "১৯.৫ Business Model"}, {"t": "p", "x": "ব্যবসা শুধু নিজের নামে পণ্য import করে resale করতে পারে; আবার buyer-এর order অনুযায়ী sourcing ও procurement service, freight coordination, customs support বা end-to-end project supply দিতে পারে। প্রতিটি model-এর revenue recognition, liability, working capital এবং customer expectation আলাদা। নিজের inventory কিনে বিক্রি করা আর customer-এর agent হিসেবে procurement করা এক নয়। Contract ও invoice-এ role স্পষ্ট করুন।"}]}, {"n": "✦", "t": "অধ্যায় ২০: বাস্তবধর্মী End-to-End Case Study", "blocks": [{"t": "p", "x": "এই case study-তে একটি কাল্পনিক বাংলাদেশি importer চীন থেকে ১,০০০ ইউনিট non-regulated household accessory আমদানি করছে। পণ্যটি বাস্তব কোনো নির্দিষ্ট tariff বা regulatory category নির্দেশ করে না; HS code ও duty নির্ধারণের জন্য বাস্তব product specification পরীক্ষা করতে হবে।"}, {"t": "h3", "x": "২০.১ Market Research"}, {"t": "p", "x": "Importer প্রথমে local wholesaler, retailer এবং online seller-এর সঙ্গে কথা বলে। Competitor price, expected demand এবং customer feedback সংগ্রহ করে। দেখা গেল পণ্যের বাজার আছে, তবে colour ও packaging preference গুরুত্বপূর্ণ। Importer তিনটি supplier shortlist করে এবং sample চায়।"}, {"t": "h3", "x": "২০.২ Supplier Selection"}, {"t": "p", "x": "তিন supplier-এর sample তুলনা করা হলো। একটি supplier কম দাম দিলেও communication দুর্বল এবং bank beneficiary mismatch ছিল। দ্বিতীয় supplier-এর price মাঝারি, কিন্তু specification, sample এবং business identity যাচাই সহজ। তৃতীয় supplier-এর MOQ বেশি। Importer দ্বিতীয় supplier-কে বেছে নেয় এবং backup হিসেবে তৃতীয় supplier-এর তথ্য রাখে।"}, {"t": "h3", "x": "২০.৩ Commercial Agreement"}, {"t": "p", "x": "Buyer product specification, colour, material, dimension, tolerance, carton quantity, label, defect criteria এবং delivery date নির্ধারণ করে। PI-তে unit price, quantity, Incoterm, payment milestone ও validity লেখা হয়। Buyer PO issue করে এবং revised artwork approve করে।"}, {"t": "h3", "x": "২০.৪ Costing ও Cash Plan"}, {"t": "p", "x": "Importer product price, origin handling, freight, insurance, bank charge,
