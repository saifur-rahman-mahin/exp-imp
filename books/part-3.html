var DATA={"head": ["THE COMPLETE IMPORT–EXPORT HANDBOOK", "তৃতীয় অংশ", "FREIGHT FORWARDING, CUSTOMS & BANGLADESH IMPORT OPERATIONS"], "note": "এই অংশে Freight Forwarding, Shipping Documentation, Customs Clearance এবং বাংলাদেশের Import Operations নিয়ে ধারাবাহিকভাবে আলোচনা করা হয়েছে। Customs duty, VAT, supplementary duty, regulatory requirement, port tariff, document format এবং সরকারি প্রক্রিয়া সময়ের সঙ্গে পরিবর্তিত হতে পারে। তাই এখানে দেওয়া ব্যাখ্যাকে শেখার ভিত্তি হিসেবে ব্যবহার করতে হবে; বাস্তব shipment-এর ক্ষেত্রে সর্বশেষ আইন, NBR/Customs নির্দেশনা, সংশ্লিষ্ট কর্তৃপক্ষের circular এবং service provider-এর লিখিত quotation যাচাই করতে হবে। কোনো নির্দিষ্ট পণ্যের HS Code, duty rate বা permit requirement অনুমান করে চূড়ান্ত সিদ্ধান্ত নেওয়া উচিত নয়।", "toc": ["অধ্যায় ১ — Freight Forwarding: ধারণা, কাজ ও ব্যবসায়িক ভূমিকা", "অধ্যায় ২ — Freight Forwarder, Shipping Line, NVOCC, Consolidator ও অন্যান্য পক্ষ", "অধ্যায় ৩ — Freight Quotation, Freight Rate ও Charge Structure", "অধ্যায় ৪ — Booking থেকে Shipment Departure: Export-side Forwarding", "অধ্যায় ৫ — Import-side Forwarding: Origin থেকে Destination পর্যন্ত সমন্বয়", "অধ্যায় ৬ — Air Freight, Sea Freight, Road ও Multimodal Transport", "অধ্যায় ৭ — Customs-এর ভূমিকা ও বাংলাদেশের Customs কাঠামো", "অধ্যায় ৮ — Importer-এর প্রস্তুতি: Registration, Bank ও Trade Compliance", "অধ্যায় ৯ — HS Code: পণ্যের পরিচয় ও Tariff Classification", "অধ্যায় ১০ — Customs Valuation, Assessable Value ও Duty Calculation", "অধ্যায় ১১ — Import Documents: কোন কাগজ কেন লাগে", "অধ্যায় ১২ — Bangladesh Import Clearance: ধাপে ধাপে বাস্তব প্রক্রিয়া", "অধ্যায় ১৩ — C&F Agent: দায়িত্ব, সীমাবদ্ধতা ও কাজের পদ্ধতি", "অধ্যায় ১৪ — Customs Examination, Assessment, Query ও Release", "অধ্যায় ১৫ — Port, ICD, CFS, Bond ও Inland Movement-এর সমন্বয়", "অধ্যায় ১৬ — Regulatory Permission, Product Compliance ও Special Cargo", "অধ্যায় ১৭ — Duty, Tax, Payment, Refund ও Dispute Management", "অধ্যায় ১৮ — Delay, Risk, Fraud ও Problem-solving", "অধ্যায় ১৯ — Small Importer, E-commerce ও China-to-Bangladesh Shipment", "অধ্যায় ২০ — Import Costing, Landed Cost ও Operational Control", "অধ্যায় ২১ — একটি বাস্তবধর্মী Import Shipment-এর পূর্ণ Case Study", "পরিশিষ্ট — গুরুত্বপূর্ণ শব্দ, Document Checklist, Agent Selection Checklist ও Common Mistakes"], "chapters": [{"id": "c1", "title": "অধ্যায় ১ — FREIGHT FORWARDING: ধারণা, কাজ ও ব্যবসায়িক ভূমিকা", "blocks": [{"t": "h", "x": "১.১ Freight Forwarding আসলে কী"}, {"t": "p", "x": "Freight Forwarding হলো এক জায়গা থেকে অন্য জায়গায় পণ্য পরিবহনের জন্য প্রয়োজনীয় logistics arrangement, carrier coordination, shipment documentation, cargo handling এবং transport-related communication পরিচালনার কাজ। একজন Freight Forwarder সাধারণত নিজে জাহাজ, বিমান বা ট্রাকের মালিক না-ও হতে পারেন। তিনি বিভিন্ন carrier, shipping line, airline, trucking company, warehouse, terminal, customs broker এবং overseas agent-এর সঙ্গে যোগাযোগ করে shipper বা importer-এর পণ্য পরিবহনের ব্যবস্থা করেন।"}, {"t": "p", "x": "সহজভাবে বললে, একজন ব্যবসায়ী চীন থেকে বাংলাদেশে পণ্য আনতে চান। তিনি হয়তো supplier-এর সঙ্গে পণ্যের দাম ঠিক করেছেন, কিন্তু এরপর পণ্য factory থেকে কোথায় যাবে, export warehouse-এ কীভাবে পৌঁছাবে, কোন vessel বা flight-এ উঠবে, freight কত হবে, কোন document তৈরি হবে, বাংলাদেশে কোন port বা airport-এ নামবে এবং destination-এ কীভাবে পৌঁছাবে—এই পুরো transport chain সাজানোর জন্য Freight Forwarder প্রয়োজন হতে পারে।"}, {"t": "lead", "x": "Freight Forwarder-এর কাজ শুধু জাহাজে জায়গা বুক করা নয়। Shipment-এর ধরন অনুযায়ী তার কাজের মধ্যে থাকতে পারে:"}, {"t": "ul", "x": ["Cargo pickup এবং origin warehouse coordination.", "Export packing, marking ও cargo readiness check.", "Shipping line বা airline-এর কাছে space booking.", "Container arrangement অথবা LCL consolidation.", "Shipping instruction সংগ্রহ ও document preparation.", "Bill of Lading বা Air Waybill process coordinate করা.", "Origin ও destination agent-এর সঙ্গে যোগাযোগ.", "Transshipment schedule এবং vessel movement update দেওয়া.", "Destination arrival notice ও local charge information পাঠানো.", "Customs broker বা C&F Agent-এর সঙ্গে coordination.", "Delivery order, terminal release বা cargo handover-এর প্রয়োজনীয় ধাপ সমন্বয়.", "Door delivery বা inland transport arrange করা, যদি scope-এ থাকে।"]}, {"t": "p", "x": "সব Forwarder সব কাজ করেন না। কেউ শুধু sea freight booking করেন, কেউ China sourcing warehouse থেকে Bangladesh delivery পর্যন্ত end-to-end service দেন, আবার কেউ নির্দিষ্ট route বা cargo type-এ বিশেষজ্ঞ। তাই “Freight Forwarding Service” শুনে ধরে নেওয়া যাবে না যে quotation-এর মধ্যে customs clearance, duty, port charge এবং door delivery সব অন্তর্ভুক্ত আছে।"}, {"t": "h", "x": "১.২ Freight Forwarder কেন দরকার"}, {"t": "p", "x": "একজন importer সরাসরি Shipping Line-এর কাছেও booking করতে পারেন। কিন্তু অনেক ক্ষেত্রে Forwarder ব্যবহার করা সুবিধাজনক, কারণ তিনি একাধিক carrier-এর rate ও schedule তুলনা করতে পারেন, cargo type অনুযায়ী উপযুক্ত service সাজাতে পারেন এবং origin-destination coordination করতে পারেন। বিশেষ করে ছোট ও মাঝারি importer-এর জন্য প্রতিটি দেশের carrier, warehouse এবং local agent-এর সঙ্গে আলাদা যোগাযোগ রাখা কঠিন।"}, {"t": "lead", "x": "Forwarder সাধারণত তিন ধরনের value তৈরি করেন:"}, {"t": "ol", "x": ["১) Information value: কোন route, service, transit time ও charge প্রযোজ্য তা বোঝানো।", "২) Coordination value: বিভিন্ন service provider-এর কাজ এক shipment-এর মধ্যে যুক্ত করা।", "৩) Execution value: booking, document, cargo movement ও exception handling-এ সহায়তা করা।"]}, {"t": "p", "x": "তবে Forwarder সবসময় carrier-এর বিকল্প নন। জাহাজ পরিচালনা, vessel schedule, container inventory, ocean carriage এবং carrier-এর নিজস্ব tariff Shipping Line বা Vessel Operator নিয়ন্ত্রণ করেন। Forwarder booking intermediary বা logistics organizer হিসেবে কাজ করতে পারেন।"}, {"t": "h", "x": "১.৩ Freight Forwarding ও Courier এক জিনিস নয়"}, {"t": "p", "x": "Courier service সাধারণত ছোট parcel, document এবং door-to-door express delivery-র জন্য তৈরি। Courier company নিজস্ব network, sorting hub এবং delivery system ব্যবহার করে। Freight Forwarding বেশি flexible; বড় cargo, pallet, container, industrial goods, project cargo বা commercial shipment-এর জন্য উপযোগী। তবে বাস্তবে দুই ব্যবস্থার মধ্যে overlap আছে। Air freight forwarder ছোট commercial cargo-ও handle করতে পারেন; courier company বড় shipment-ও নিতে পারে। পার্থক্য নির্ভর করে service model, weight/volume, customs arrangement এবং delivery scope-এর ওপর।"}, {"t": "h", "x": "১.৪ Freight Forwarder-এর legal ও commercial role"}, {"t": "p", "x": "একজন Forwarder কোন capacity-তে কাজ করছেন, তা গুরুত্বপূর্ণ। তিনি শুধু agent হিসেবে carrier-এর booking করাচ্ছেন, নাকি নিজের নামে transport document issue করছেন—এতে দায় ও contractual relationship বদলে যেতে পারে। কিছু Forwarder নিজেদের House Bill of Lading (HBL) issue করেন; carrier issue করেন Master Bill of Lading (MBL)। Air freight-এ House Air Waybill (HAWB) এবং Master Air Waybill (MAWB) থাকতে পারে।"}, {"t": "p", "x": "Quotation, booking confirmation, bill of lading এবং service agreement-এ Forwarder-এর legal name, role, liability terms, limitation of liability এবং claim procedure দেখে নিতে হবে। শুধু WhatsApp-এ “আমরা সব দায়িত্ব নেব” বলা যথেষ্ট নয়।"}]}, {"id": "c2", "title": "অধ্যায় ২ — FREIGHT FORWARDER, SHIPPING LINE, NVOCC, CONSOLIDATOR ও অন্যান্য পক্ষ", "blocks": [{"t": "h", "x": "২.১ Shipping Line"}, {"t": "p", "x": "Shipping Line হলো সমুদ্রপথে cargo বহনকারী carrier বা carrier organization। তারা vessel পরিচালনা করতে পারে অথবা vessel space charter করতে পারে। Shipping Line container সরবরাহ, booking acceptance, ocean carriage, schedule publication, Bill of Lading issue এবং destination delivery process-এর গুরুত্বপূর্ণ অংশ নিয়ন্ত্রণ করে।"}, {"t": "p", "x": "একটি shipment-এ importer Forwarder-এর সঙ্গে কাজ করলেও ocean carriage-এর carrier হতে পারে আলাদা Shipping Line। Bill of Lading-এ “Carrier” হিসেবে কার নাম আছে, তা পরীক্ষা করা জরুরি।"}, {"t": "h", "x": "২.২ Freight Forwarder"}, {"t": "p", "x": "Forwarder shipper-এর পক্ষে transport arrangement করেন। তিনি carrier-এর সঙ্গে rate negotiate, space book, cargo pickup, documentation এবং destination agent coordination করতে পারেন। Forwarder-এর service scope লিখিতভাবে নির্ধারণ করতে হবে।"}, {"t": "h", "x": "২.৩ NVOCC"}, {"t": "p", "x": "NVOCC-এর পূর্ণরূপ Non-Vessel Operating Common Carrier। সাধারণভাবে NVOCC নিজস্ব vessel পরিচালনা না করেও carrier-এর মতো transport service বিক্রি করতে পারে এবং নিজের নামে House Bill of Lading issue করতে পারে। তিনি vessel-operating carrier-এর কাছ থেকে space কিনে customer-কে transport service দিতে পারেন। বিভিন্ন দেশের আইন অনুযায়ী NVOCC-এর registration, licensing বা financial requirements ভিন্ন হতে পারে।"}, {"t": "h", "x": "২.৪ Consolidator"}, {"t": "p", "x": "Consolidator বিভিন্ন shipper-এর ছোট ছোট cargo একত্র করে একটি বড় shipment বা container তৈরি করেন। LCL (Less than Container Load) cargo-তে এটি খুব গুরুত্বপূর্ণ। উদাহরণস্বরূপ, তিনজন importer-এর cargo আলাদা আলাদা করে একটি পূর্ণ container ভরার মতো নয়। Consolidator সেগুলো CFS-এ এনে এক container-এ load করে destination-এ পৌঁছানোর পর আলাদা করে দেন।"}, {"t": "p", "x": "Consolidation-এর সুবিধা হলো ছোট importer-কে পুরো container-এর freight বহন করতে হয় না। অসুবিধা হতে পারে cargo receiving cutoff, consolidation schedule, deconsolidation charge, handling এবং অন্য shipper-এর cargo-জনিত delay।"}, {"t": "h", "x": "২.৫ Customs Broker বা C&F Agent"}, {"t": "p", "x": "Customs Broker বা বাংলাদেশে প্রচলিত ভাষায় C&F Agent importer/exporter-এর পক্ষে customs clearance-এর কাজ পরিচালনা করেন, প্রযোজ্য লাইসেন্স ও আইন মেনে। তিনি Bill of Entry বা সংশ্লিষ্ট declaration প্রস্তুত/দাখিলের কাজে সহায়তা, HS Code ও document review, assessment coordination, examination attendance এবং release process পরিচালনা করতে পারেন। C&F Agent Freight Forwarder নন, যদিও কোনো প্রতিষ্ঠান দুই ধরনের service-ই দিতে পারে।"}, {"t": "h", "x": "২.৬ Shipping Agent ও Port Agent"}, {"t": "p", "x": "Vessel-এর port call, berth, port documentation, crew, cargo operation এবং vessel-related coordination-এ Shipping Agent বা Port Agent কাজ করতে পারেন। তারা shipowner বা carrier-এর local representative হিসেবে কাজ করেন। Importer-এর C&F Agent-এর সঙ্গে তাদের ভূমিকা এক নয়।"}, {"t": "h", "x": "২.৭ Trucking Company ও Transport Contractor"}, {"t": "p", "x": "Origin pickup, port delivery, container haulage, port থেকে warehouse movement এবং empty container return-এর জন্য trucking company বা transport contractor ব্যবহৃত হয়। Container transport-এ chassis, tractor head, driver, route permission, weight limit ও delivery appointment গুরুত্বপূর্ণ।"}, {"t": "h", "x": "২.৮ Warehouse, CFS ও Terminal Operator"}, {"t": "p", "x": "Warehouse cargo সংরক্ষণ করে; CFS LCL cargo receiving, consolidation, deconsolidation ও handling করতে পারে; Container Terminal Operator yard, gate এবং vessel operation পরিচালনা করেন। এদের charge, operating hour, cargo acceptance rule এবং liability আলাদা।"}, {"t": "h", "x": "২.৯ Origin Agent ও Destination Agent"}, {"t": "p", "x": "আন্তর্জাতিক Forwarding network-এ origin agent supplier-এর কাছ থেকে cargo collect, export documentation ও origin handling করেন। Destination agent arrival notice, local coordination, deconsolidation, delivery বা customs broker referral করতে পারেন। Importer-কে জানতে হবে destination agent-এর charge মূল quotation-এ আছে কি না। “Destination handling included” লেখা থাকলেও কোন কোন item included তা itemized breakdown ছাড়া বোঝা যায় না।"}]}, {"id": "c3", "title": "অধ্যায় ৩ — FREIGHT QUOTATION, FREIGHT RATE ও CHARGE STRUCTURE", "blocks": [{"t": "h", "x": "৩.১ Freight quotation কী"}, {"t": "p", "x": "Freight quotation হলো নির্দিষ্ট cargo, route, transport mode, service scope এবং validity period অনুযায়ী পরিবহন ও সংশ্লিষ্ট service-এর আনুমানিক বা চুক্তিভিত্তিক মূল্য প্রস্তাব। Quotation-এ rate ছাড়াও shipment condition, cutoff, transit time, free time, excluded charge, surcharge এবং payment terms উল্লেখ থাকা উচিত।"}, {"t": "h", "x": "৩.২ Rate তুলনা করার আগে যে তথ্য দিতে হবে"}, {"t": "lead", "x": "একটি সঠিক freight quotation পেতে Forwarder-কে অন্তত নিচের তথ্য দিন:"}, {"t": "ul", "x": ["Origin city, supplier address বা pickup point.", "Destination city, port বা airport.", "Cargo description এবং commodity.", "Total gross weight.", "Package সংখ্যা, package type এবং dimensions.", "Total CBM (cubic meter), যদি sea freight হয়.", "Cargo ready date.", "FCL না LCL; 20GP, 40GP, 40HC ইত্যাদি container type, যদি জানা থাকে.", "Dangerous goods, battery, liquid, chemical, food, plant বা controlled goods কি না.", "Customs clearance, insurance, pickup, delivery এবং duty quotation-এর scope-এ লাগবে কি না।"]}, {"t": "p", "x": "শুধু “চীন থেকে বাংলাদেশ ১০০ কেজি মাল আনব, কত?”—এমন প্রশ্নে নির্ভুল rate দেওয়া কঠিন। একই ১০০ কেজি পণ্যের volume, packaging, commodity, route ও service অনুযায়ী charge অনেক বদলে যেতে পারে।"}, {"t": "h", "x": "৩.৩ Ocean Freight"}, {"t": "p", "x": "Ocean Freight হলো সমুদ্রপথে cargo বহনের মূল freight charge। FCL-এ সাধারণত container size/type এবং route অনুযায়ী rate হয়। LCL-এ chargeable volume বা weight, minimum charge এবং handling rule প্রযোজ্য হতে পারে। Ocean freight-এর সঙ্গে origin/destination local charges সবসময় অন্তর্ভুক্ত থাকে না।"}, {"t": "h", "x": "৩.৪ Origin Charges"}, {"t": "p", "x": "Origin country-তে cargo receiving, warehouse handling, export documentation, customs-related handling, container loading, terminal handling, seal, trucking এবং অন্যান্য service charge থাকতে পারে। সব route-এ সব charge একই নামে বা একই পদ্ধতিতে আসে না।"}, {"t": "h", "x": "৩.৫ Destination Charges"}, {"t": "p", "x": "Destination-এ terminal handling, delivery order, documentation, deconsolidation, CFS handling, port-related charge, local agent fee, container-related charge এবং delivery arrangement থাকতে পারে। Import duty ও tax সাধারণত আলাদা government payment; এগুলো freight quotation-এর সঙ্গে গুলিয়ে ফেলা যাবে না।"}, {"t": "h", "x": "৩.৬ Surcharge"}, {"t": "p", "x": "Bunker-related surcharge, peak season surcharge, congestion surcharge, emergency fuel surcharge, currency adjustment বা carrier-নির্ধারিত অন্য surcharge থাকতে পারে। কোন surcharge প্রযোজ্য, rate কতদিন valid এবং rate পরিবর্তনের শর্ত কী—লিখিতভাবে জানতে হবে।"}, {"t": "h", "x": "৩.৭ Chargeable Weight: Air Freight"}, {"t": "p", "x": "Air freight-এ actual gross weight এবং volumetric weight-এর মধ্যে যেটি বেশি, সাধারণত সেটির ভিত্তিতে chargeable weight নির্ধারণ করা হয়; তবে carrier ও service-specific rule যাচাই করতে হবে। Volumetric weight হিসাবের divisor carrier, route ও product অনুযায়ী ভিন্ন হতে পারে। প্রচলিত উদাহরণে dimensions centimetre-এ নিয়ে L×W×H ভাগ 6000 করা হয়, কিন্তু এটিকে universal rule ধরা যাবে না। Quotation দেওয়ার আগে Forwarder-এর divisor নিশ্চিত করুন।"}, {"t": "p", "x": "উদাহরণ: একটি carton-এর মাপ 60×50×40 cm। Volume = 120,000 cubic centimetres। যদি divisor 6000 হয়, volumetric weight = 20 kg। Actual weight 14 kg হলে chargeable weight 20 kg হতে পারে। যদি carrier অন্য divisor ব্যবহার করে, ফল বদলাবে।"}, {"t": "h", "x": "৩.৮ LCL Chargeable Volume"}, {"t": "p", "x": "LCL-এ অনেক ক্ষেত্রে W/M (Weight or Measurement) basis ব্যবহৃত হয়—অর্থাৎ weight ও measurement-এর মধ্যে যে basis অনুযায়ী বেশি charge হয়। তবে local minimum, density rule, commodity surcharge এবং handling minimum থাকতে পারে। ১ CBM-এর কম cargo-তে minimum charge হওয়ায় rate-per-CBM দেখে মোট খরচ কম মনে হলেও final invoice বেশি হতে পারে।"}, {"t": "h", "x": "৩.৯ Quotation-এ যে প্রশ্নগুলো করবেন"}, {"t": "ul", "x": ["Rate কোন তারিখ পর্যন্ত valid?", "কোন vessel/flight বা sailing schedule ধরা হয়েছে?", "Transit time port-to-port, নাকি door-to-door?", "Origin charges included?", "Destination charges included?", "Customs clearance included, নাকি শুধু coordination?", "Duty, VAT ও other government tax included কি না?", "Port storage, demurrage, detention এবং warehouse storage কার দায়িত্ব?", "Free time কত দিন এবং কোন তারিখ থেকে গণনা হবে?", "Rate prepaid, collect, নাকি অন্য payment arrangement?", "Cargo insurance included কি না?", "Delay, rollover, transshipment বা cancellation হলে কী charge হবে?"]}, {"t": "h", "x": "৩.১০ Low Freight Rate-এর ঝুঁকি"}, {"t": "p", "x": "একটি quotation অন্যটির চেয়ে অনেক কম হলে কারণ খুঁজুন। হয়তো সেটিতে destination charge নেই, customs clearance নেই, transit time দীর্ঘ, transshipment বেশি, cargo handling বা delivery excluded, অথবা পরে নানা local charge যোগ হবে। শুধু ocean freight rate তুলনা না করে total logistics cost তুলনা করুন।"}]}, {"id": "c4", "title": "অধ্যায় ৪ — BOOKING থেকে SHIPMENT DEPARTURE: EXPORT-SIDE FORWARDING", "blocks": [{"t": "h", "x": "৪.১ Cargo readiness"}, {"t": "p", "x": "Supplier পণ্য তৈরি করলেই cargo shipment-ready হয়ে যায় না। পণ্য সঠিকভাবে packed, marked, counted, measured এবং export requirements অনুযায়ী প্রস্তুত কি না যাচাই করতে হয়। Cargo description invoice ও packing list-এর সঙ্গে মিলতে হবে। Wooden packaging হলে destination country-এর applicable treatment/marking requirements যাচাই করা প্রয়োজন। Dangerous goods হলে classification, packaging, marking, labeling এবং declaration rule অনুসরণ করতে হবে।"}, {"t": "h", "x": "৪.২ Booking Request"}, {"t": "p", "x": "Forwarder বা shipper carrier-এর কাছে booking request পাঠান। এতে shipper, consignee, notify party, commodity, container type, quantity, gross weight, origin/destination, cargo ready date এবং requested sailing উল্লেখ থাকতে পারে। Carrier booking গ্রহণ করলে booking confirmation বা booking number দেয়। Booking confirmation-এ vessel/voyage, cutoff, gate-in location, container release instruction এবং special condition থাকতে পারে।"}, {"t": "h", "x": "৪.৩ Space Confirmation ও Equipment"}, {"t": "p", "x": "Booking confirmation মানেই সবসময় cargo জাহাজে উঠবেই—এমন নিশ্চয়তা নয়। Vessel schedule পরিবর্তন, equipment shortage, port congestion, documentation issue, customs hold বা carrier operational decision-এর কারণে shipment পরের sailing-এ যেতে পারে। Empty container release হলে container number, condition, seal process এবং pickup timing যাচাই করতে হবে।"}, {"t": "h", "x": "৪.৪ Stuffing"}, {"t": "p", "x": "Container-এ cargo load করার প্রক্রিয়াকে stuffing বলা হয়। Stuffing-এর সময় weight distribution, cargo securing, blocking/bracing, moisture protection, door clearance এবং container payload limit বিবেচনা করতে হয়। ভারী cargo এক পাশে বা দরজার কাছে অনিরাপদভাবে রাখলে transport-এ cargo shift বা accident হতে পারে। Container-এর CSC plate, condition এবং suitability পরীক্ষা করা উচিত।"}, {"t": "h", "x": "৪.৫ VGM"}, {"t": "p", "x": "VGM-এর পূর্ণরূপ Verified Gross Mass। SOLAS framework অনুযায়ী container জাহাজে load করার আগে verified gross mass ship-এর master বা terminal-কে নির্ধারিত পদ্ধতিতে জানাতে হয়। সাধারণভাবে packed container-এর মোট verified weight নির্ধারণের দুটি স্বীকৃত পদ্ধতি রয়েছে: সম্পূর্ণ packed container weigh করা, অথবা cargo, packaging ও securing material-এর verified weight যোগ করে container tare weight যুক্ত করা। স্থানীয়/জাতীয় অনুমোদিত পদ্ধতি ও carrier instruction অনুসরণ করতে হবে। VGM না থাকলে container load না-ও হতে পারে।"}, {"t": "h", "x": "৪.৬ Shipping Instruction"}, {"t": "p", "x": "Shipping Instruction (SI) হলো Bill of Lading প্রস্তুতের জন্য carrier বা Forwarder-কে দেওয়া shipment information। এতে shipper, consignee, notify party, vessel/voyage, port of loading, port of discharge, place of delivery, cargo description, package count, weight, measurement, container/seal number এবং freight term থাকতে পারে। SI ভুল হলে Bill of Lading-এ ভুল আসতে পারে।"}, {"t": "h", "x": "৪.৭ Cutoff"}, {"t": "p", "x": "Documentation cutoff, SI cutoff, VGM cutoff, gate-in cutoff এবং customs cutoff আলাদা হতে পারে। একটিতে সময়মতো কাজ করলেই অন্যগুলো সম্পন্ন হয়েছে ধরে নেওয়া যাবে না। Forwarder-এর কাছ থেকে প্রতিটি cutoff লিখিতভাবে নিন।"}, {"t": "h", "x": "৪.৮ Gate-in ও Loading"}, {"t": "p", "x": "Container terminal-এ gate-in করার পর terminal system-এ container record হয়। এরপর yard allocation, loading plan এবং vessel operation অনুযায়ী container জাহাজে ওঠে। Container gate-in করলেই vessel-এ load নিশ্চিত নয়; customs hold, weight discrepancy, documentation issue বা operational disruption হতে পারে। Actual loading confirmation ও departure update সংগ্রহ করুন।"}]}, {"id": "c5", "title": "অধ্যায় ৫ — IMPORT-SIDE FORWARDING: ORIGIN থেকে DESTINATION", "blocks": [{"t": "h", "x": "৫.১ Importer-এর সঙ্গে Forwarder-এর প্রাথমিক আলোচনা"}, {"t": "p", "x": "Importer প্রথমে cargo কী, কোথা থেকে আসবে, কীভাবে transport হবে এবং final delivery কোথায়—তা নির্ধারণ করেন। Supplier-এর invoice, packing list, cargo dimensions, readiness date এবং pickup address সংগ্রহ করা হয়। Product description অস্পষ্ট হলে freight quotation, dangerous goods screening ও customs planning-এ সমস্যা হয়।"}, {"t": "h", "x": "৫.২ Supplier pickup ও origin warehouse"}, {"t": "p", "x": "Supplier-এর factory বা warehouse থেকে cargo সংগ্রহ করে Forwarder-এর nominated warehouse-এ নেওয়া হতে পারে। সেখানে cargo count, package condition, gross weight, dimension এবং label যাচাই করা হয়। Consolidation service হলে একাধিক supplier-এর cargo একত্র করা হয়। Cargo receiving receipt বা warehouse receiving report নেওয়া উচিত।"}, {"t": "h", "x": "৫.৩ Export clearance"}, {"t": "p", "x": "Origin country-তে export declaration বা customs process লাগতে পারে। কোন party exporter of record হবে, কোন export document লাগবে এবং export restriction আছে কি না—তা origin agent ও supplier-এর সঙ্গে নিশ্চিত করতে হবে। বাংলাদেশের importer সাধারণত অন্য দেশের export clearance নিজে পরিচালনা করেন না; তবে document correctness এবং commercial arrangement নিশ্চিত করার দায়িত্ব তারও আছে।"}, {"t": "h", "x": "৫.৪ Main Carriage"}, {"t": "p", "x": "Main carriage হলো origin থেকে destination পর্যন্ত প্রধান পরিবহন অংশ—যেমন ocean freight বা air freight। Sea freight-এ direct service অথবা transshipment থাকতে পারে। Transshipment মানে মাঝপথের কোনো port-এ cargo এক vessel থেকে অন্য vessel-এ transfer হয়। এতে route ও transit time বাড়তে পারে এবং connection miss হলে delay হতে পারে।"}, {"t": "h", "x": "৫.৫ Arrival Notice"}, {"t": "p", "x": "Destination port বা airport-এ cargo আসার আগে carrier/agent arrival notice পাঠাতে পারেন। এতে ETA, vessel/voyage, B/L বা AWB reference, container information এবং local charge/payment instruction থাকতে পারে। ETA (Estimated Time of Arrival) পরিবর্তনশীল; এটি guaranteed arrival time নয়।"}, {"t": "h", "x": "৫.৬ Destination handling ও customs clearance"}, {"t": "p", "x": "Cargo destination-এ পৌঁছানোর পর customs clearance আলাদা প্রক্রিয়া। Forwarder arrival notice, delivery order coordination বা destination handling-এ সাহায্য করতে পারেন; কিন্তু customs declaration ও regulatory compliance-এর কাজ importer এবং তার appointed C&F Agent-এর সঙ্গে সমন্বয় করে সম্পন্ন করতে হয়।"}, {"t": "h", "x": "৫.৭ Door Delivery"}, {"t": "p", "x": "Port/airport থেকে importer-এর warehouse পর্যন্ত delivery quotation-এ অন্তর্ভুক্ত থাকলে transport arrangement করা হয়। Delivery-র আগে vehicle type, loading/unloading responsibility, warehouse access, appointment, unloading equipment, waiting charge এবং empty container return plan নিশ্চিত করতে হবে।"}]}, {"id": "c6", "title": "অধ্যায় ৬ — AIR FREIGHT, SEA FREIGHT, ROAD ও MULTIMODAL TRANSPORT", "blocks": [{"t": "h", "x": "৬.১ Sea Freight"}, {"t": "p", "x": "বড় volume, ভারী cargo এবং তুলনামূলক কম urgency-র shipment-এ Sea Freight বহুল ব্যবহৃত। FCL-এ একটি container নির্দিষ্ট shipper-এর cargo-র জন্য ব্যবহৃত হয়; LCL-এ এক container-এ একাধিক shipper-এর cargo থাকে। Sea freight-এর transit time route, vessel schedule, transshipment, port congestion এবং customs/terminal operation-এর ওপর নির্ভর করে।"}, {"t": "h", "x": "৬.২ Air Freight"}, {"t": "p", "x": "Air freight দ্রুততর হতে পারে এবং high-value, urgent, lightweight বা time-sensitive goods-এর জন্য উপযোগী। তবে freight cost বেশি এবং volumetric weight গুরুত্বপূর্ণ। Battery, chemical, liquid, perfume, magnetized item বা dangerous goods-এর ক্ষেত্রে airline restriction ও documentation requirement থাকতে পারে। “Air cargo” মানেই সব পণ্য বিমানে নেওয়া যাবে—এমন নয়।"}, {"t": "h", "x": "৬.৩ Road Freight"}, {"t": "p", "x": "সড়কপথে cross-border transport নির্দিষ্ট regional corridor-এ গুরুত্বপূর্ণ। Road freight-এ border crossing, transit permit, vehicle documentation, customs transit, route restriction, border congestion এবং transshipment/vehicle change-এর বিষয় থাকতে পারে। Bangladesh-China shipment-এর ক্ষেত্রে সাধারণত সরাসরি road route practical কিনা তা route-specific যাচাই করতে হবে; শুধু মানচিত্র দেখে transport plan করা যায় না।"}, {"t": "h", "x": "৬.৪ Rail Freight"}, {"t": "p", "x": "Rail freight বড় volume ও নির্দিষ্ট corridor-এ কার্যকর হতে পারে। Rail terminal, gauge compatibility, border interchange, schedule, inland haulage এবং customs coordination গুরুত্বপূর্ণ। Rail service-এর availability route ও সময়ভেদে বদলায়।"}, {"t": "h", "x": "৬.৫ Multimodal Transport"}, {"t": "p", "x": "একটি shipment যদি একাধিক mode—যেমন truck + sea + truck, অথবা rail + sea—ব্যবহার করে, সেটি multimodal transport হতে পারে। একটি through transport document-এ একাধিক mode cover করা হতে পারে, তবে contractual arrangement ও liability terms বুঝতে হবে। কে পুরো journey-এর দায়িত্ব নিচ্ছে, কোথায় risk transfer হচ্ছে এবং claim কোথায় করতে হবে—এসব স্পষ্ট থাকতে হবে।"}, {"t": "h", "x": "৬.৬ কোন mode বেছে নেবেন"}, {"t": "lead", "x": "শুধু freight rate দেখে mode নির্বাচন করা ঠিক নয়। বিবেচনা করুন:"}, {"t": "ul", "x": ["পণ্যের value এবং urgency.", "Cargo volume ও weight.", "Damage বা theft sensitivity.", "Shelf life বা expiry.", "Dangerous goods status.", "Customs/permit requirements.", "Total door-to-door cost.", "Inventory holding cost ও stockout risk.", "Buyer-এর delivery commitment."]}, {"t": "p", "x": "একটি পণ্য Air Freight-এ দ্রুত এলে inventory কম আটকে থাকতে পারে; আবার Sea Freight-এ খরচ কম হলেও দীর্ঘ transit time-এর কারণে working capital ও stock planning-এ প্রভাব পড়তে পারে।"}]}, {"id": "c7", "title": "অধ্যায় ৭ — CUSTOMS-এর ভূমিকা ও বাংলাদেশের CUSTOMS কাঠামো", "blocks": [{"t": "h", "x": "৭.১ Customs কী"}, {"t": "p", "x": "Customs হলো রাষ্ট্রের সীমান্ত দিয়ে পণ্য আমদানি, রপ্তানি ও transit-এর ওপর আইনগত নিয়ন্ত্রণ, declaration, classification, valuation, duty-tax collection এবং নিষিদ্ধ/নিয়ন্ত্রিত পণ্যের compliance নিশ্চিত করার সরকারি ব্যবস্থা। Customs শুধু tax collection করে না; trade facilitation, security, revenue protection, prohibited goods control এবং trade statistics-ও এর কাজের অংশ।"}, {"t": "h", "x": "৭.২ Customs কেন পণ্যের তথ্য চায়"}, {"t": "p", "x": "Customs জানতে চায় পণ্যটি কী, কত পরিমাণ, কোথা থেকে এসেছে, কার কাছে আসছে, এর transaction value কত, কোন HS Code প্রযোজ্য, কী duty-tax লাগবে এবং কোনো permit বা restriction আছে কি না। Invoice-এ “accessories”, “gift item” বা “general goods” লেখা থাকলে পণ্যের প্রকৃত পরিচয় বোঝা কঠিন হতে পারে। সঠিক description ও supporting documents অত্যন্ত গুরুত্বপূর্ণ।"}, {"t": "h", "x": "৭.৩ Bangladesh Customs ও NBR"}, {"t": "p", "x": "বাংলাদেশে Customs administration জাতীয় রাজস্ব বোর্ড (NBR)-এর অধীন কাঠামোর অংশ। Import clearance সংশ্লিষ্ট Customs House/Customs station এবং প্রযোজ্য port/airport/land customs station-এ পরিচালিত হয়। Port authority, terminal operator, carrier এবং Customs—এরা আলাদা প্রতিষ্ঠান/পক্ষ; একজনের release অন্যজনের release-এর বিকল্প নয়।"}, {"t": "h", "x": "৭.৪ Customs House ও Customs Station"}, {"t": "p", "x": "Customs House বা সংশ্লিষ্ট customs station-এ import/export declaration, assessment, examination, duty-tax payment এবং release-এর কাজ হয়। কোন port-এ কোন ধরনের cargo বা procedure handle হবে, তা সংশ্লিষ্ট কর্তৃপক্ষের jurisdiction ও facility অনুযায়ী নির্ধারিত।"}, {"t": "h", "x": "৭.৫ Customs Control বনাম Port Operation"}, {"t": "p", "x": "Port terminal cargo রাখে ও move করে; Customs আইন অনুযায়ী cargo declaration, assessment, examination ও clearance নিয়ন্ত্রণ করে। Port থেকে cargo বের করতে Customs release-এর পাশাপাশি carrier/Shipping Line-এর delivery release, terminal/port release এবং applicable charges settlement প্রয়োজন হতে পারে।"}, {"t": "h", "x": "৭.৬ Risk Management"}, {"t": "p", "x": "সব shipment একই মাত্রায় physical examination-এর মধ্য দিয়ে যায় না। Customs declaration, importer profile, commodity risk, origin, valuation concern, intelligence এবং applicable risk parameters অনুযায়ী documentary check, scanning বা physical examination হতে পারে। “সব container খুলে দেখা হয়” অথবা “কোনো container-ই দেখা হয় না”—দুটিই ভুল সাধারণীকরণ।"}]}, {"id": "c8", "title": "অধ্যায় ৮ — IMPORTER-এর প্রস্তুতি: REGISTRATION, BANK ও TRADE COMPLIANCE", "blocks": [{"t": "h", "x": "৮.১ Importer হিসেবে ব্যবসার প্রস্তুতি"}, {"t": "p", "x": "Commercial import শুরু করার আগে ব্যবসার legal identity, tax registration, trade permission, bank relationship এবং প্রযোজ্য import registration প্রস্তুত করতে হয়। বাংলাদেশে ব্যবসার ধরন, পণ্যের category এবং import arrangement অনুযায়ী প্রয়োজনীয় কাগজপত্র আলাদা হতে পারে।"}, {"t": "h", "x": "৮.২ Trade License"}, {"t": "p", "x": "ব্যবসার কার্যক্রম ও স্থানীয় কর্তৃপক্ষের নিয়ম অনুযায়ী Trade License প্রয়োজন হতে পারে। Trade License-এর business nature এবং বাস্তব import activity-র মধ্যে সামঞ্জস্য থাকা উচিত।"}, {"t": "h", "x": "৮.৩ TIN ও BIN/VAT Registration"}, {"t": "p", "x": "Taxpayer Identification Number (TIN) এবং VAT/BIN সংক্রান্ত registration ব্যবসার tax compliance-এ গুরুত্বপূর্ণ। কোন import transaction-এ কোন registration বা document লাগবে, তা বর্তমান আইন ও পণ্যের ধরন অনুযায়ী যাচাই করতে হবে।"}, {"t": "h", "x": "৮.৪ Import Registration Certificate (IRC)"}, {"t": "p", "x": "বাংলাদেশে commercial importer-দের ক্ষেত্রে Import Registration Certificate (IRC) গুরুত্বপূর্ণ registration instrument। IRC-এর category, eligibility, renewal, documentation এবং সংশ্লিষ্ট fee/requirement সময়ের সঙ্গে পরিবর্তিত হতে পারে। সংশ্লিষ্ট আমদানি নীতি আদেশ ও Chief Controller of Imports and Exports (CCI&E)-এর সর্বশেষ নির্দেশনা যাচাই করা উচিত।"}, {"t": "h", "x": "৮.৫ Export Registration Certificate (ERC)"}, {"t": "p", "x": "রপ্তানিকারকের ক্ষেত্রে Export Registration Certificate (ERC) প্রযোজ্য হতে পারে। Importer-এর IRC এবং Exporter-এর ERC এক জিনিস নয়। ব্যবসার ধরন ও applicable rule অনুযায়ী registration requirement নিশ্চিত করতে হবে।"}, {"t": "h", "x": "৮.৬ Authorized Dealer Bank"}, {"t": "p", "x": "International trade payment, LC, remittance, import documentation এবং foreign exchange compliance-এর জন্য Authorized Dealer (AD) bank গুরুত্বপূর্ণ। Importer-এর bank শুধু টাকা পাঠানোর মাধ্যম নয়; foreign exchange regulation এবং trade document-এর সঙ্গে সংশ্লিষ্ট compliance-ও থাকে।"}, {"t": "h", "x": "৮.৭ Import Policy Order ও Restricted Goods"}, {"t": "p", "x": "বাংলাদেশে Import Policy Order এবং অন্যান্য আইন/নিয়মে কিছু পণ্য নিষিদ্ধ, সীমাবদ্ধ বা শর্তসাপেক্ষে আমদানিযোগ্য হতে পারে। কোনো পণ্য Alibaba বা 1688-এ বিক্রি হচ্ছে বলেই বাংলাদেশে বৈধভাবে আমদানি করা যাবে—এমন নয়। Order দেওয়ার আগেই product legality, permit, standard, labeling এবং clearance requirement যাচাই করুন।"}, {"t": "h", "x": "৮.৮ Importer of Record"}, {"t": "p", "x": "কাস্টমস declaration-এ যে importer-এর নামে পণ্য আমদানি হচ্ছে, তার legal responsibility গুরুত্বপূর্ণ। অন্য কারও IRC বা কাগজ ব্যবহার করে নিজের ব্যবসার পণ্য আনতে গেলে আইনগত ও financial risk তৈরি হতে পারে। কে importer of record, কে payment করছে, কে goods-এর owner এবং কে customs declaration-এর তথ্যের সত্যতা নিশ্চিত করছে—এসব লিখিতভাবে পরিষ্কার রাখুন।"}]}, {"id": "c9", "title": "অধ্যায় ৯ — HS CODE: পণ্যের পরিচয় ও TARIFF CLASSIFICATION", "blocks": [{"t": "h", "x": "৯.১ HS Code কী"}, {"t": "p", "x": "HS Code হলো Harmonized System-এর অধীনে পণ্য শ্রেণিবিন্যাসের code। আন্তর্জাতিক বাণিজ্যে পণ্যকে নির্দিষ্ট category-তে classify করার জন্য এই system ব্যবহৃত হয়। আন্তর্জাতিক HS nomenclature-এর প্রথম ছয় digit অনেক দেশের মধ্যে harmonized হলেও দেশভেদে national tariff line-এ অতিরিক্ত digit থাকতে পারে। বাংলাদেশের applicable tariff schedule-এ নির্দিষ্ট national code ও description দেখতে হয়।"}, {"t": "h", "x": "৯.২ HS Code কেন গুরুত্বপূর্ণ"}, {"t": "lead", "x": "HS Code-এর ওপর নির্ভর করতে পারে:"}, {"t": "ul", "x": ["Customs duty ও অন্যান্য tax rate.", "Import restriction বা permit requirement.", "Product-specific regulatory control.", "Statistical classification.", "Preferential tariff বা trade agreement-এর eligibility.", "Customs valuation ও declaration review-এর supporting context."]}, {"t": "p", "x": "ভুল HS Code ব্যবহার করলে কম duty দেওয়ার অভিযোগ, অতিরিক্ত duty demand, penalty, delay, seizure বা অন্য legal consequence হতে পারে।"}, {"t": "h", "x": "৯.৩ HS Code অনুমান করবেন না"}, {"t": "p", "x": "শুধু পণ্যের নাম দিয়ে HS Code নির্ধারণ করা নিরাপদ নয়। একই নামের পণ্যের material, function, composition, processing, technical specification, intended use এবং presentation অনুযায়ী classification বদলাতে পারে। যেমন “plastic item” কোনো যথেষ্ট description নয়; এটি household article, packaging article, component বা অন্য heading-এর অধীনে পড়তে পারে।"}, {"t": "h", "x": "৯.৪ Classification-এর জন্য কী তথ্য লাগবে"}, {"t": "ul", "x": ["Commercial name ও precise product description.", "Main material ও composition.", "Function বা principal use.", "Product কীভাবে কাজ করে.", "Technical specification, model ও catalogue.", "Photo, drawing বা product datasheet.", "Set বা kit হলে প্রতিটি component.", "Chemical হলে composition/CAS information, যেখানে প্রযোজ্য.", "Food/plant/animal product হলে nature, processing ও intended use."]}, {"t": "h", "x": "৯.৫ HS Heading, Subheading ও National Tariff Line"}, {"t": "p", "x": "HS structure-এ Chapter, Heading, Subheading এবং national tariff extension থাকতে পারে। Classification করতে General Rules for Interpretation (GIR), Section Notes, Chapter Notes এবং relevant explanatory material বিবেচনা করতে হয়। শুধু online search result দেখে code copy করলে ভুল হওয়ার ঝুঁকি থাকে।"}, {"t": "h", "x": "৯.৬ Binding বা Advance Ruling"}, {"t": "p", "x": "কিছু jurisdiction-এ নির্দিষ্ট পণ্যের classification বা customs treatment নিয়ে advance ruling বা binding decision নেওয়ার ব্যবস্থা আছে। বাংলাদেশে কোনো নির্দিষ্ট পণ্যের ক্ষেত্রে এমন সুবিধা ও প্রক্রিয়া বর্তমানে কীভাবে প্রযোজ্য, তা সংশ্লিষ্ট Customs/NBR-এর সর্বশেষ নির্দেশনা থেকে যাচাই করতে হবে। লিখিত কর্তৃপক্ষীয় সিদ্ধান্ত থাকলে তা informal agent opinion-এর চেয়ে বেশি নির্ভরযোগ্য।"}, {"t": "h", "x": "৯.৭ HS Code Verification Workflow"}, {"t": "p", "x": "প্রথমে product specification সংগ্রহ করুন। এরপর সম্ভাব্য heading চিহ্নিত করুন, tariff schedule ও legal notes পড়ুন, applicable national code এবং duty rate যাচাই করুন, C&F Agent বা customs classification specialist-এর মতামত নিন এবং গুরুত্বপূর্ণ/বিতর্কিত পণ্যে লিখিত clarification সংগ্রহ করুন। Quotation বা purchase order final করার আগে classification ও regulatory requirement যাচাই করা সবচেয়ে নিরাপদ।"}]}, {"id": "c10", "title": "অধ্যায় ১০ — CUSTOMS VALUATION, ASSESSABLE VALUE ও DUTY CALCULATION", "blocks": [{"t": "h", "x": "১০.১ Customs Value কী"}, {"t": "p", "x": "Customs valuation হলো duty assessment-এর জন্য আমদানিকৃত পণ্যের customs value নির্ধারণের পদ্ধতি। অনেক ক্ষেত্রে transaction value—অর্থাৎ বিক্রয়ের জন্য export করা পণ্যের প্রকৃত মূল্য—প্রধান ভিত্তি হয়, তবে আইন অনুযায়ী শর্ত, adjustment এবং supporting evidence প্রযোজ্য। Customs invoice value দেখেই সবসময় অন্ধভাবে গ্রহণ করে না; সন্দেহ বা আইনি কারণ থাকলে অতিরিক্ত তথ্য চাইতে পারে বা valuation method প্রয়োগ করতে পারে।"}, {"t": "h", "x": "১০.২ Invoice Value ও Customs Value এক নয় কেন হতে পারে"}, {"t": "p", "x": "Commercial invoice-এ পণ্যের price থাকে। কিন্তু applicable valuation rules অনুযায়ী freight, insurance, packing, assists, royalty/license fee বা অন্যান্য নির্দিষ্ট cost adjustment বিবেচনায় আসতে পারে। কোন item যোগ বা বাদ হবে, তা transaction terms ও আইন অনুযায়ী নির্ধারিত হয়। Incoterms-এ price FOB, CFR, CIF বা অন্য basis-এ থাকলে valuation calculation-এ তার প্রভাব পড়ে।"}, {"t": "h", "x": "১০.৩ Incoterms ও Customs Valuation"}, {"t": "p", "x": "FOB price-এ সাধারণত seller-এর দায়িত্ব পণ্য ship-এর board-এ তোলা পর্যন্ত নির্ধারিত হয়; CFR-এ seller freight দেয়; CIF-এ seller cost, insurance ও freight দেয়—তবে risk transfer point আলাদা হতে পারে। Customs valuation-এর জন্য কোন cost already included এবং কোনটি আলাদা যোগ করতে হবে, তা invoice ও contract থেকে যাচাই করতে হয়। Incoterms নিজে customs valuation law নয়; এটি buyer-seller-এর cost, risk ও responsibility allocation বোঝায়।"}, {"t": "h", "x": "১০.৪ Assessable Value"}, {"t": "p", "x": "Assessable Value হলো customs duty ও tax calculation-এর জন্য প্রযোজ্য মূল্যভিত্তি। এটি নির্দিষ্ট valuation rule, exchange rate, freight/insurance adjustment এবং applicable tax base অনুযায়ী নির্ধারিত হতে পারে। বাংলাদেশের import assessment-এ কোন exchange rate ও valuation method কার্যকর হবে, তা declaration/assessment date এবং current rules অনুযায়ী নিশ্চিত করতে হবে।"}, {"t": "h", "x": "১০.৫ Duty ও Tax-এর ধরন"}, {"t": "p", "x": "বাংলাদেশে পণ্যভেদে Customs Duty (CD), Regulatory Duty (RD), Supplementary Duty (SD), Value Added Tax (VAT), Advance Tax (AT), Advance Income Tax (AIT) বা অন্য প্রযোজ্য levy থাকতে পারে। সব পণ্যে সব tax লাগে না। Tax rate ও tax base পণ্য, HS Code, tariff schedule এবং আইন অনুযায়ী নির্ধারিত হয়।"}, {"t": "h", "x": "১০.৬ একটি সরল উদাহরণ"}, {"t": "p", "x": "ধরা যাক একটি পণ্যের hypothetical assessable value ১,০০,০০০ টাকা। শুধু উদাহরণের জন্য ধরা হলো CD ১০%। তাহলে CD = ১০,০০০ টাকা। এরপর অন্য tax-এর base কীভাবে নির্ধারিত হবে তা প্রযোজ্য আইনের ওপর নির্ভর করবে; কিছু tax base-এ CD বা অন্য duty অন্তর্ভুক্ত হতে পারে। তাই CD ১০% + VAT ১৫% = সরাসরি ২৫% ধরে নেওয়া ঠিক নয়। প্রকৃত duty calculation-এ tax-on-tax structure, exemption, minimum value, specific duty এবং অন্য provision থাকতে পারে।"}, {"t": "h", "x": "১০.৭ Duty Calculator-এর সীমাবদ্ধতা"}, {"t": "p", "x": "Online duty calculator বা agent-এর spreadsheet প্রাথমিক ধারণা দিতে পারে। কিন্তু HS Code ভুল, exchange rate ভুল, tax base ভুল, exemption/condition বাদ পড়া বা latest tariff update না থাকলে ফল ভুল হবে। Final costing-এর আগে official tariff এবং qualified C&F/Customs professional-এর মাধ্যমে verify করুন।"}, {"t": "h", "x": "১০.৮ Undervaluation ও Misdeclaration"}, {"t": "p", "x": "Invoice value কম দেখানো, পণ্যের description বদলে দেওয়া, quantity কম দেখানো বা ভুল HS Code দিয়ে কম duty দেওয়ার চেষ্টা গুরুতর ঝুঁকি। Customs যদি transaction value গ্রহণ না করে বা misdeclaration পায়, তাহলে reassessment, additional duty, penalty, confiscation বা prosecution-এর ঝুঁকি তৈরি হতে পারে। Supplier-কে “কম invoice বানিয়ে দিন” বলা importer-এর জন্য নিরাপদ ব্যবসায়িক কৌশল নয়।"}]}, {"id": "c11", "title": "অধ্যায় ১১ — IMPORT DOCUMENTS: কোন কাগজ কেন লাগে", "blocks": [{"t": "h", "x": "১১.১ Commercial Invoice"}, {"t": "p", "x": "Commercial Invoice-এ seller, buyer, invoice number/date, product description, quantity, unit price, total value, currency, payment term এবং applicable delivery term থাকে। Customs valuation, bank processing এবং buyer-seller transaction evidence-এর জন্য এটি গুরুত্বপূর্ণ। Description যেন generic না হয়; model, material, specification ও use উল্লেখ করা প্রয়োজন হতে পারে।"}, {"t": "h", "x": "১১.২ Packing List"}, {"t": "p", "x": "Packing List-এ package সংখ্যা, package type, item-wise quantity, net weight, gross weight, dimensions, marks এবং packing details থাকে। Customs examination, cargo identification, warehouse handling ও delivery planning-এ এটি ব্যবহৃত হয়। Invoice ও Packing List-এর quantity/description-এ অমিল থাকলে query হতে পারে।"}, {"t": "h", "x": "১১.৩ Bill of Lading"}, {"t": "p", "x": "Sea shipment-এর Bill of Lading (B/L) carrier বা তার authorized agent কর্তৃক issue করা গুরুত্বপূর্ণ transport document। এটি cargo receipt, contract of carriage-এর evidence এবং negotiable form হলে title-related function পালন করতে পারে। সব B/L negotiable নয়। Original B/L, Sea Waybill, telex release বা express release—কোন arrangement ব্যবহার হচ্ছে তা বুঝতে হবে।"}, {"t": "h", "x": "১১.৪ Air Waybill"}, {"t": "p", "x": "Air Waybill (AWB) air cargo transport document। এটি সাধারণত non-negotiable; B/L-এর মতো title document হিসেবে কাজ করে না। MAWB/HAWB structure থাকতে পারে। Consignee details ও cargo description সঠিক হওয়া জরুরি।"}, {"t": "h", "x": "১১.৫ Certificate of Origin"}, {"t": "p", "x": "Certificate of Origin (COO) পণ্যের country of origin সম্পর্কে নির্দিষ্ট authority বা authorized organization কর্তৃক দেওয়া certificate। Preferential tariff, trade agreement, import requirement বা buyer request-এর জন্য প্রয়োজন হতে পারে। COO সাধারণত পণ্য কোথা থেকে ship হয়েছে তা নয়, বরং applicable origin rules অনুযায়ী পণ্যের origin কী—তা বোঝায়। COO কে issue করবে তা দেশ ও scheme অনুযায়ী নির্ধারিত; সব ক্ষেত্রে Customs officer সরাসরি issue করেন না।"}, {"t": "h", "x": "১১.৬ Insurance Certificate/Policy"}, {"t": "p", "x": "Insurance certificate বা policy cargo insurance cover-এর evidence। CIF term থাকলেও insurance coverage কতটুকু, কোন risk covered, deductible কত এবং claim process কী—তা আলাদা করে যাচাই করা দরকার। “Insurance included” মানেই সব ধরনের loss covered নয়।"}, {"t": "h", "x": "১১.৭ Proforma Invoice ও Purchase Order"}, {"t": "p", "x": "Proforma Invoice (PI) seller-এর preliminary offer বা payment/LC processing-এর জন্য ব্যবহৃত হতে পারে; Purchase Order (PO) buyer-এর purchase instruction/commitment। PI, PO এবং final Commercial Invoice-এর product description, quantity, price, currency ও terms মিলিয়ে রাখা উচিত।"}, {"t": "h", "x": "১১.৮ LC Documents"}, {"t": "p", "x": "Letter of Credit transaction-এ LC terms অনুযায়ী Commercial Invoice, Packing List, B/L বা AWB, Insurance Document, COO, Inspection Certificate বা অন্যান্য document প্রয়োজন হতে পারে। Bank সাধারণত LC-তে নির্ধারিত document-এর compliance পরীক্ষা করে; পণ্য বাস্তবে কেমন এসেছে তা bank document examination-এর বিকল্প নয়। Discrepancy হলে payment delay বা refusal-এর ঝুঁকি থাকে।"}, {"t": "h", "x": "১১.৯ Regulatory Certificates"}, {"t": "p", "x": "পণ্যের ধরন অনুযায়ী BSTI, Bangladesh Food Safety Authority, Plant Quarantine, Department of Fisheries, Drug Administration, Environment Department, Explosives Department বা অন্য competent authority-এর certificate/permit/NOC লাগতে পারে। সব পণ্যে সব certificate লাগে না। পণ্যের HS Code, composition, intended use এবং current import rules অনুযায়ী যাচাই করতে হবে।"}, {"t": "h", "x": "১১.১০ Document Consistency"}, {"t": "p", "x": "সব document-এ shipper/exporter, consignee/importer, product description, quantity, package count, weight, invoice value, currency, origin, B/L/AWB reference এবং shipment details যথাসম্ভব consistent থাকতে হবে। বানান বা address-এর ছোট অমিলও কখনো bank, carrier বা customs query তৈরি করতে পারে।"}]}, {"id": "c12", "title": "অধ্যায় ১২ — BANGLADESH IMPORT CLEARANCE: ধাপে ধাপে বাস্তব প্রক্রিয়া", "blocks": [{"t": "h", "x": "১২.১ Shipment আসার আগেই প্রস্তুতি"}, {"t": "p", "x": "ভালো importer cargo arrival-এর পর কাজ শুরু করেন না; shipment origin-এ থাকা অবস্থাতেই document ও clearance planning শুরু করেন। Supplier-এর কাছ থেকে draft invoice, packing list, product specification, HS Code proposal, COO বা permit requirement সংগ্রহ করুন। C&F Agent-কে আগে থেকেই document পাঠিয়ে সম্ভাব্য classification, regulatory requirement এবং clearance cost সম্পর্কে লিখিত ধারণা নিন।"}, {"t": "h", "x": "১২.২ Arrival Notice ও Document Collection"}, {"t": "p", "x": "Vessel বা flight destination-এ আসার আগে carrier/agent arrival notice দিতে পারে। Importer/agent B/L বা AWB copy, Commercial Invoice, Packing List, COO, insurance document এবং applicable certificate সংগ্রহ করেন। Original B/L প্রয়োজন কি না, telex release হয়েছে কি না, bank endorsement লাগবে কি না—carrier-এর সঙ্গে নিশ্চিত করতে হবে।"}, {"t": "h", "x": "১২.৩ Delivery Order"}, {"t": "p", "x": "Sea import-এ carrier বা authorized agent-এর কাছ থেকে Delivery Order (DO) বা সমতুল্য delivery authorization নেওয়ার প্রয়োজন হতে পারে। DO issue-এর আগে freight collect, local charge, documentation fee বা অন্যান্য carrier charge settlement লাগতে পারে। DO পাওয়া মানেই Customs release হয়ে গেছে নয়; এটি carrier-side cargo delivery process-এর অংশ।"}, {"t": "h", "x": "১২.৪ Bill of Entry"}, {"t": "p", "x": "Bill of Entry হলো import declaration-এর গুরুত্বপূর্ণ দলিল/ইলেকট্রনিক declaration, যেখানে importer, goods description, HS Code, quantity, value, origin, transport details এবং applicable declaration information দেওয়া হয়। বাংলাদেশে প্রযোজ্য electronic customs system ও current procedure অনুযায়ী declaration দাখিল হয়। Declaration-এ ভুল তথ্য দিলে importer-এর legal responsibility তৈরি হতে পারে; তাই C&F Agent প্রস্তুত করলেও importer-এর document review করা উচিত।"}, {"t": "h", "x": "১২.৫ Assessment"}, {"t": "p", "x": "Customs declaration ও supporting document যাচাই করে applicable duty-tax নির্ধারণের প্রক্রিয়া assessment। Classification, valuation, origin, exemption, permit এবং declaration-এর accuracy এখানে গুরুত্বপূর্ণ। Customs query দিলে প্রয়োজনীয় document বা clarification দিতে হয়।"}, {"t": "h", "x": "১২.৬ Examination"}, {"t": "p", "x": "Customs risk selection বা assessment decision অনুযায়ী document check, scan অথবা physical examination হতে পারে। Examination-এ declared description, quantity, package, marking, model, composition বা অন্য বিষয় যাচাই করা হতে পারে। Physical examination হলে C&F Agent বা authorized representative-এর উপস্থিতি ও coordination প্রয়োজন হতে পারে।"}, {"t": "h", "x": "১২.৭ Duty-Tax Payment"}, {"t": "p", "x": "Assessment final হলে applicable duty-tax সরকারি নির্ধারিত payment channel-এ পরিশোধ করতে হয়। Payment challan/receipt ও declaration reference সংরক্ষণ করুন। C&F Agent-কে টাকা দিলে লিখিত fund request, breakdown, payment evidence এবং reconciliation নিন। Government duty-tax এবং agent service fee আলাদা দেখানো উচিত।"}, {"t": "h", "x": "১২.৮ Customs Release"}, {"t": "p", "x": "প্রয়োজনীয় assessment, examination, document এবং payment requirement পূরণ হলে Customs release/clearance status দেওয়া হয়। কোনো permit, bond condition বা অন্য regulatory hold থাকলে release বিলম্বিত হতে পারে।"}, {"t": "h", "x": "১২.৯ Carrier ও Terminal Release"}, {"t": "p", "x": "Customs release-এর পাশাপাশি carrier-side delivery release, terminal charge settlement, port/terminal release এবং gate pass প্রক্রিয়া সম্পন্ন করতে হতে পারে। Container shipment-এ empty container return obligation এবং free time গুরুত্বপূর্ণ। LCL cargo-তে CFS deconsolidation ও cargo handover process থাকতে পারে।"}, {"t": "h", "x": "১২.১০ Gate-out ও Delivery"}, {"t": "p", "x": "Cargo terminal থেকে বের হওয়ার সময় gate pass, truck/container number, seal, package count এবং cargo condition যাচাই করুন। Warehouse-এ পৌঁছালে receiving report তৈরি করুন। Damage, shortage বা seal discrepancy থাকলে সঙ্গে সঙ্গে ছবি, delivery note, survey report এবং carrier/insurer notification-এর evidence সংরক্ষণ করুন।"}]}, {"id": "c13", "title": "অধ্যায় ১৩ — C&F AGENT: দায়িত্ব, সীমাবদ্ধতা ও কাজের পদ্ধতি", "blocks": [{"t": "h", "x": "১৩.১ C&F Agent কে"}, {"t": "p", "x": "বাংলাদেশে Clearing and Forwarding (C&F) Agent বলতে সাধারণত সেই service provider-কে বোঝায়, যিনি importer বা exporter-এর পক্ষে customs clearance এবং সংশ্লিষ্ট port/terminal coordination করেন। “Forwarding” শব্দ থাকলেও C&F Agent-এর কাজ Freight Forwarder-এর সমান নয়। C&F Agent-এর licensing, authorization এবং কাজের পরিধি সংশ্লিষ্ট আইন ও Customs rules অনুযায়ী হতে হবে।"}, {"t": "h", "x": "১৩.২ C&F Agent-এর সাধারণ কাজ"}, {"t": "ul", "x": ["Importer-এর document collect ও preliminary review.", "HS Code, product description ও declaration data প্রস্তুত/যাচাইয়ে সহায়তা.", "Bill of Entry বা applicable declaration process পরিচালনা.", "Customs assessment ও query-তে coordination.", "Examination/inspection-এর সময় উপস্থিতি বা প্রতিনিধি সমন্বয়.", "Duty-tax calculation ও payment instruction জানানো.", "Customs release এবং সংশ্লিষ্ট port/terminal process coordinate করা.", "Delivery Order, gate pass ও cargo delivery-তে সহায়তা, scope অনুযায়ী.", "Importer-কে delay, query, extra cost ও document deficiency জানানো।"]}, {"t": "h", "x": "১৩.৩ C&F Agent কী করতে পারেন না"}, {"t": "p", "x": "C&F Agent আইন অমান্য করে পণ্য release করানোর নিশ্চয়তা দিতে পারেন না। তিনি Customs-এর decision নিয়ন্ত্রণ করেন না, duty rate নিজের ইচ্ছায় নির্ধারণ করেন না এবং importer-এর ভুল declaration-কে বৈধ করে দিতে পারেন না। “আমার লোক আছে, কোনো সমস্যা হবে না”—এ ধরনের নিশ্চয়তার বদলে লিখিত process, document requirement ও lawful cost breakdown চাইতে হবে।"}, {"t": "h", "x": "১৩.৪ C&F Service Fee বনাম Government Charge"}, {"t": "p", "x": "C&F Agent-এর professional/service fee, documentation fee, attendance fee বা agreed handling fee এক ধরনের charge। Customs duty-tax, port charge, carrier charge, terminal charge এবং storage আলাদা। Invoice-এ সব একসঙ্গে lump sum দিলে importer-এর পক্ষে খরচ যাচাই করা কঠিন হয়।"}, {"t": "h", "x": "১৩.৫ C&F Agent নির্বাচন"}, {"t": "ul", "x": ["Valid license/authorization ও business identity যাচাই.", "নির্দিষ্ট port ও commodity-তে অভিজ্ঞতা.", "লিখিত quotation ও scope of service.", "Duty-tax estimate-এর assumptions.", "অতিরিক্ত charge হলে prior approval policy.", "Government payment-এর receipt প্রদান.", "Document confidentiality ও data security.", "Delay বা dispute হলে escalation contact.", "Past client reference, যেখানে সম্ভব."]}, {"t": "h", "x": "১৩.৬ একাধিক Agent-এর Quote তুলনা"}, {"t": "p", "x": "একই shipment information দিয়ে অন্তত দুই-তিনটি quote নিন। কিন্তু শুধু service fee কম বলে agent নির্বাচন করবেন না। কে document review করবে, HS Code যাচাই করবে, examination attendance দেবে, delivery order ও gate-out coordinate করবে এবং কোন charge excluded—এসব তুলনা করুন।"}]}, {"id": "c14", "title": "অধ্যায় ১৪ — CUSTOMS EXAMINATION, ASSESSMENT, QUERY ও RELEASE", "blocks": [{"t": "h", "x": "১৪.১ Documentary Check"}, {"t": "p", "x": "Customs officer বা system declaration-এর সঙ্গে invoice, packing list, transport document, permit এবং অন্যান্য supporting paper মিলিয়ে দেখতে পারে। Document-এ inconsistency থাকলে query উঠতে পারে।"}, {"t": "h", "x": "১৪.২ Scanning"}, {"t": "p", "x": "কিছু cargo/container non-intrusive inspection system দিয়ে scan করা হতে পারে। Scan image বা risk indicator অনুযায়ী further examination প্রয়োজন হতে পারে। Scanning সব shipment-এর জন্য একইভাবে বা একই stage-এ হয় না।"}, {"t": "h", "x": "১৪.৩ Physical Examination"}, {"t": "p", "x": "Physical examination-এ container বা package খুলে পণ্য দেখা, count, marking, model, material বা declared description যাচাই করা হতে পারে। Cargo খুললে repacking, handling, labor, equipment এবং time-related cost তৈরি হতে পারে। Examination-এর record, discrepancy এবং seal status সংরক্ষণ করুন।"}, {"t": "h", "x": "১৪.৪ Query কেন হয়"}, {"t": "ul", "x": ["Product description অস্পষ্ট.", "HS Code নিয়ে সন্দেহ.", "Invoice value বা transaction evidence অপর্যাপ্ত.", "Quantity, weight বা package mismatch.", "COO বা origin claim-এর অসামঞ্জস্য.", "Permit/NOC বা certificate অনুপস্থিত.", "Importer registration বা bank document issue.", "Restricted/prohibited item concern.", "Previous declaration বা risk profile-related issue."]}, {"t": "h", "x": "১৪.৫ Query-এর উত্তর কীভাবে দেবেন"}, {"t": "p", "x": "প্রথমে query-র সঠিক বিষয় বুঝুন। তারপর supplier catalogue, technical datasheet, product photo, composition declaration, purchase contract, payment evidence, freight invoice, insurance document বা সংশ্লিষ্ট authority certificate দিন। অনুমানভিত্তিক উত্তর বা নতুন করে বানানো document দেবেন না। C&F Agent-এর মাধ্যমে response জমা হলেও importer যেন submitted explanation-এর copy রাখেন।"}, {"t": "h", "x": "১৪.৬ Reassessment ও Dispute"}, {"t": "p", "x": "Customs classification বা valuation decision importer-এর প্রত্যাশার সঙ্গে না মিললে applicable law-এ review, appeal বা adjudication-এর পথ থাকতে পারে। সময়সীমা ও forum গুরুত্বপূর্ণ। মৌখিক তর্কের বদলে written assessment, legal basis, document এবং professional advice নিয়ে এগোন।"}, {"t": "h", "x": "১৪.৭ Release-এর আগে Final Reconciliation"}, {"t": "lead", "x": "Release-এর আগে যাচাই করুন:"}, {"t": "ul", "x": ["Declared goods ও actual goods মিলেছে কি না.", "Duty-tax assessment ও payment মিলেছে কি না.", "Carrier/Shipping Line charge paid কি না.", "Delivery Order issue হয়েছে কি না.", "Terminal/port charge outstanding আছে কি না.", "Container free time ও empty return deadline কী.", "Warehouse delivery arrangement প্রস্তুত কি না।"]}]}, {"id": "c15", "title": "অধ্যায় ১৫ — PORT, ICD, CFS, BOND ও INLAND MOVEMENT-এর সমন্বয়", "blocks": [{"t": "h", "x": "১৫.১ Seaport ও Inland Container Depot"}, {"t": "p", "x": "Seaport হলো সমুদ্রবন্দর; Inland Container Depot (ICD) হলো দেশের অভ্যন্তরে container handling, storage, customs-related operation বা rail/road connection-সহ নির্দিষ্ট logistics facility। কোন cargo সরাসরি seaport-এ clear হবে, কোনটি ICD-তে যাবে এবং কোন process প্রযোজ্য—তা port operation, customs arrangement ও cargo type অনুযায়ী নির্ধারিত।"}, {"t": "h", "x": "১৫.২ Off-dock ও Private Depot"}, {"t": "p", "x": "বাংলাদেশে কিছু export/import container handling বা storage কার্যক্রম port-এর বাইরে অনুমোদিত private depot/off-dock facility-তে হতে পারে। এসব facility-র role, authorized cargo category, customs supervision এবং movement procedure নির্দিষ্ট নিয়মে পরিচালিত হয়। সব cargo যেকোনো off-dock-এ নেওয়া যায় না।"}, {"t": "h", "x": "১৫.৩ CFS"}, {"t": "p", "x": "Container Freight Station (CFS) বিশেষত LCL cargo-র ক্ষেত্রে গুরুত্বপূর্ণ। Origin-এ বিভিন্ন shipper-এর cargo receive করে consolidation এবং destination-এ deconsolidation করা হয়। CFS charge, storage, handling, cargo identification এবং delivery release-এর নিয়ম আগে জেনে নিন।"}, {"t": "h", "x": "১৫.৪ Bonded Warehouse"}, {"t": "p", "x": "Bonded warehouse হলো Customs-এর অনুমোদন ও নিয়ন্ত্রণাধীন warehouse arrangement, যেখানে নির্দিষ্ট শর্তে imported goods duty-tax স্থগিত/নিয়ন্ত্রিত অবস্থায় রাখা বা ব্যবহার করা যায়। Export-oriented industry-তে bonded facility গুরুত্বপূর্ণ হতে পারে। Bond facility-র eligibility, inventory control, utilization, audit এবং removal procedure কঠোরভাবে মানতে হয়। Bonded warehouse মানে duty কখনোই দিতে হবে না—এমন নয়; permitted use ও conditions ভঙ্গ হলে liability তৈরি হতে পারে।"}, {"t": "h", "x": "১৫.৫ Transshipment ও Transit Cargo"}, {"t": "p", "x": "কোনো cargo এক port থেকে অন্য port বা দেশের মধ্য দিয়ে final destination-এ গেলে transit/transshipment procedure প্রযোজ্য হতে পারে। Customs seal, transit declaration, guarantee, route এবং time limit-এর মতো শর্ত থাকতে পারে। Transit cargo-কে domestic import cargo-এর মতো ধরে নেওয়া যাবে না।"}, {"t": "h", "x": "১৫.৬ Inland Transport Planning"}, {"t": "p", "x": "Port থেকে warehouse-এ container নেওয়ার আগে road condition, bridge/vehicle weight limit, truck availability, delivery slot, unloading equipment, labor, warehouse entrance এবং empty return depot বিবেচনা করুন। Container delivery ও unloading-এর পর empty container কোথায়, কখন এবং কোন condition-এ ফেরত দিতে হবে তা লিখিতভাবে জেনে নিন।"}]}, {"id": "c16", "title": "অধ্যায় ১৬ — REGULATORY PERMISSION, PRODUCT COMPLIANCE ও SPECIAL CARGO", "blocks": [{"t": "h", "x": "১৬.১ কেন regulatory check জরুরি"}, {"t": "p", "x": "একটি পণ্য commercial invoice ও freight booking-এ গ্রহণ করা হলেও destination country-তে import permission না-ও পেতে পারে। Customs clearance-এর আগে সংশ্লিষ্ট regulator-এর permit, certificate, test report, registration বা labeling requirement থাকতে পারে। তাই product selection-এর সময়ই compliance check করতে হবে।"}, {"t": "h", "x": "১৬.২ Food ও Food Contact Products"}, {"t": "p", "x": "খাদ্যপণ্য, food ingredients, supplements, food-contact packaging বা kitchenware-এর ক্ষেত্রে product category অনুযায়ী food safety, composition, labeling, expiry, health certificate, test report বা অন্য requirement থাকতে পারে। “Kitchen item” বলে সব পণ্যকে একই নিয়মে ফেলা যায় না।"}, {"t": "h", "x": "১৬.৩ Plant, Seed ও Agricultural Products"}, {"t": "p", "x": "Plant, seed, soil, timber, fresh produce বা agricultural product-এর ক্ষেত্রে Plant Quarantine ও phytosanitary requirement প্রযোজ্য হতে পারে। Phytosanitary Certificate সাধারণত competent plant-health authority issue করে; Port security বা সাধারণ freight forwarder এটি issue করেন না। Import permit, treatment, inspection ও prohibited species restriction যাচাই করতে হবে।"}, {"t": "h", "x": "১৬.৪ Animal ও Fisheries Products"}, {"t": "p", "x": "Animal-origin product, fish, seafood, meat, dairy, animal feed বা related goods-এর ক্ষেত্রে veterinary/health certificate, quarantine, inspection এবং competent authority approval লাগতে পারে। পণ্যের species, processing এবং origin অনুযায়ী requirement ভিন্ন হতে পারে।"}, {"t": "h", "x": "১৬.৫ Medicine, Medical Device ও Chemical"}, {"t": "p", "x": "Medicine, medical device, chemical, laboratory reagent এবং industrial chemical-এর ক্ষেত্রে বিশেষ regulatory control থাকতে পারে। Registration, import permission, composition, safety data sheet (SDS), labeling, storage condition এবং end-use declaration প্রয়োজন হতে পারে। পণ্যের নাম অস্পষ্ট রেখে shipment করলে clearance risk বাড়ে।"}, {"t": "h", "x": "১৬.৬ Battery ও Dangerous Goods"}, {"t": "p", "x": "Lithium battery, flammable liquid, gas cylinder, corrosive chemical, oxidizer, explosive-related material এবং অন্য dangerous goods-এর ক্ষেত্রে transport mode অনুযায়ী classification, UN number, packing instruction, marking, label, declaration এবং carrier acceptance লাগে। Sea ও air transport-এর rule এক নয়। Supplier “এটা সাধারণ পণ্য” বললেই carrier acceptance নিশ্চিত হয় না।"}, {"t": "h", "x": "১৬.৭ Radio, Telecom ও Electronic Equipment"}, {"t": "p", "x": "Wireless transmitter, telecom equipment, radio module, communication device, encrypted equipment বা frequency-related product-এর ক্ষেত্রে relevant regulator approval/type approval বা import condition থাকতে পারে। Product specification ও frequency band যাচাই করুন।"}, {"t": "h", "x": "১৬.৮ Standards ও Certification"}, {"t": "p", "x": "কিছু পণ্যে Bangladesh Standards and Testing Institution (BSTI) বা অন্য competent authority-এর mandatory standard, test, certification বা clearance requirement থাকতে পারে। সব imported product-এ BSTI certificate লাগে না; product-specific mandatory list ও current circular দেখতে হবে।"}, {"t": "h", "x": "১৬.৯ Used, Refurbished ও Second-hand Goods"}, {"t": "p", "x": "Used machinery, refurbished electronics, second-hand equipment বা scrap-এর ওপর আলাদা import restriction, inspection, age limit, condition requirement বা valuation concern থাকতে পারে। Supplier নতুন বলে invoice দিলেও পণ্য বাস্তবে used হলে misdeclaration risk তৈরি হবে।"}]}, {"id": "c17", "title": "অধ্যায় ১৭ — DUTY, TAX, PAYMENT, REFUND ও DISPUTE MANAGEMENT", "blocks": [{"t": "h", "x": "১৭.১ Government Payment ও Agent Payment আলাদা রাখুন"}, {"t": "p", "x": "Customs duty-tax সরকারি নির্ধারিত channel-এ জমা হয়। C&F Agent-এর service fee, port/terminal charge, carrier charge ও trucking charge আলাদা payee-র কাছে যেতে পারে। একসঙ্গে টাকা দিলে প্রতিটি payment-এর breakdown এবং receipt চাইতে হবে।"}, {"t": "h", "x": "১৭.২ Duty Estimate বনাম Final Assessment"}, {"t": "p", "x": "Shipment-এর আগে C&F Agent সম্ভাব্য duty-tax estimate দিতে পারেন। কিন্তু final amount নির্ভর করে Customs-এর classification, valuation, exchange rate, tariff এবং applicable law-এর ওপর। Estimate-কে guaranteed amount হিসেবে গ্রহণ করবেন না; assumptions লিখিতভাবে নিন।"}, {"t": "h", "x": "১৭.৩ Advance Payment ও Fund Control"}, {"t": "p", "x": "C&F Agent বা logistics provider advance চাইলে লিখিত fund request নিন। এতে charge category, estimated amount, payee, payment deadline এবং unused balance ফেরতের নিয়ম থাকতে হবে। Payment proof ও ledger রাখুন।"}, {"t": "h", "x": "১৭.৪ Refund, Drawback ও Adjustment"}, {"t": "p", "x": "কিছু পরিস্থিতিতে duty/tax refund, drawback, rebate বা adjustment-এর সুযোগ থাকতে পারে, তবে eligibility ও procedure আইননির্ভর। Export-oriented industry, re-export, overpayment বা অন্য নির্দিষ্ট case-এ আলাদা rule থাকতে পারে। কোনো refund নিশ্চিত ধরে ব্যবসার costing করবেন না; আগে eligibility verify করুন।"}, {"t": "h", "x": "১৭.৫ Dispute হলে Evidence"}, {"t": "p", "x": "Invoice, PO, contract, payment proof, shipping instruction, B/L/AWB, arrival notice, delivery order, customs declaration, assessment, challan, agent invoice, gate pass, delivery note, cargo photo, survey report এবং email/WhatsApp approval log সংরক্ষণ করুন। গুরুত্বপূর্ণ নির্দেশনা ফোনে হলে পরে email বা message-এ লিখিত confirmation নিন।"}]}, {"id": "c18", "title": "অধ্যায় ১৮ — DELAY, RISK, FRAUD ও PROBLEM-SOLVING", "blocks": [{"t": "h", "x": "১৮.১ Shipment Delay-এর সাধারণ কারণ"}, {"t": "ul", "x": ["Supplier production delay.", "Cargo not ready বা packaging problem.", "Booking space বা equipment shortage.", "Vessel rollover বা flight cancellation.", "Transshipment connection miss.", "Port congestion বা bad weather.", "Export/import customs hold.", "Document discrepancy.", "Regulatory permit delay.", "Destination charge unpaid.", "Truck shortage বা warehouse appointment issue."]}, {"t": "p", "x": "Delay হলে প্রথমে বোঝার চেষ্টা করুন কোন stage-এ shipment আটকে আছে। “মাল port-এ আটকে আছে” বলা যথেষ্ট নয়। Cargo vessel-এ উঠেনি, transshipment hub-এ আছে, destination terminal-এ discharge হয়েছে, customs hold-এ আছে, নাকি carrier release pending—এগুলো আলাদা অবস্থা।"}, {"t": "h", "x": "১৮.২ Demurrage, Detention ও Storage"}, {"t": "p", "x": "Demurrage সাধারণত terminal/port-এ container free time অতিক্রম করে থাকলে carrier tariff অনুযায়ী charge হতে পারে। Detention সাধারণত terminal-এর বাইরে container ব্যবহারের সময় free period অতিক্রম করলে carrier charge হতে পারে। Storage charge terminal/warehouse-এর নিজস্ব tariff অনুযায়ী হতে পারে। বাস্তবে contract ও carrier tariff অনুযায়ী সংজ্ঞা/গণনা ভিন্ন হতে পারে। Free time কখন শুরু, calendar day না working day, holiday treatment এবং rate slab লিখিতভাবে জেনে নিন।"}, {"t": "h", "x": "১৮.৩ Fraud Warning"}, {"t": "ul", "x": ["অস্বাভাবিক কম freight rate দিয়ে পরে অতিরিক্ত charge.", "Fake carrier/agent email বা payment account change.", "Original document আটকে রেখে অযৌক্তিক টাকা দাবি.", "Duty কমানোর নামে undervaluation বা false declaration.", "Cargo weight/quantity লুকানো.", "Supplier ও Forwarder-এর collusion.", "Fake insurance certificate.", "Cargo না নিয়েই shipment update দেখানো."]}, {"t": "p", "x": "Bank account পরিবর্তনের নির্দেশ এলে পরিচিত official phone number দিয়ে আলাদাভাবে verify করুন। শুধু email reply-এর ওপর নির্ভর করবেন না; email account compromise হতে পারে।"}, {"t": "h", "x": "১৮.৪ Problem Escalation"}, {"t": "p", "x": "একটি shipment-এর জন্য escalation ladder তৈরি করুন: প্রথমে operational contact, এরপর supervisor/branch manager, তারপর carrier/terminal/Customs-এর official channel বা relevant authority, এবং প্রয়োজনে legal/professional adviser। প্রতিটি complaint-এ shipment reference, date, event timeline, requested action এবং supporting evidence দিন।"}]}, {"id": "c19", "title": "অধ্যায় ১৯ — SMALL IMPORTER, E-COMMERCE ও CHINA-TO-BANGLADESH SHIPMENT", "blocks": [{"t": "h", "x": "১৯.১ ছোট Importer-এর বাস্তবতা"}, {"t": "p", "x": "বাংলাদেশে অনেক ছোট ব্যবসায়ী বড় container import করেন না। কেউ Facebook page বা group-এ পণ্যের ছবি পোস্ট করেন, customer order সংগ্রহ করেন, তারপর China marketplace বা supplier থেকে একাধিক order কিনে একত্রে shipment আনেন। অনেক ক্ষেত্রে cargo ১০–১৫ কেজির carton বা কয়েকটি carton হতে পারে। এ ধরনের model-এ sourcing, payment, consolidation, freight, customs এবং last-mile delivery একসঙ্গে পরিকল্পনা করতে হয়।"}, {"t": "h", "x": "১৯.২ 1688 বা Alibaba Order থেকে Shipment"}, {"t": "p", "x": "Supplier থেকে পণ্য কেনার পর প্রথমে নিশ্চিত করতে হবে supplier কোথায় cargo পাঠাবে। China warehouse address, receiving code, customer reference, package label এবং receiving deadline ঠিকভাবে দিতে হয়। Supplier একাধিক হলে প্রতিটি package-এ আলাদা reference থাকা দরকার, যাতে warehouse বুঝতে পারে কোন cargo কোন buyer-এর।"}, {"t": "h", "x": "১৯.৩ Consolidation-এর সুবিধা ও সীমাবদ্ধতা"}, {"t": "p", "x": "একাধিক supplier-এর cargo এক warehouse-এ এনে consolidate করলে আলাদা আলাদা shipment-এর তুলনায় freight cost কমতে পারে। তবে warehouse receiving fee, consolidation fee, repacking, storage, measurement, inspection এবং export handling charge থাকতে পারে। সব পণ্য এক container বা carton-এ মিশিয়ে দিলে item-wise identification হারানোর ঝুঁকি থাকে।"}, {"t": "h", "x": "১৯.৪ ১০–১৫ কেজির Carton মানেই Personal Import নয়"}, {"t": "p", "x": "Cargo weight কম হলেই shipment personal baggage বা duty-free parcel হয়ে যায় না। Commercial purpose, product type, quantity, value, import arrangement, applicable law এবং declaration requirement গুরুত্বপূর্ণ। ছোট shipment-ও customs declaration, duty-tax ও regulatory requirement-এর আওতায় আসতে পারে।"}, {"t": "h", "x": "১৯.৫ “All-in Rate” বুঝে নিন"}, {"t": "p", "x": "Small importer-দের কাছে অনেক Forwarder প্রতি কেজি বা প্রতি CBM all-in rate দেন। কিন্তু all-in কথার সুনির্দিষ্ট scope লিখিতভাবে নিন। Rate-এর মধ্যে China pickup, warehouse receiving, consolidation, export handling, freight, Bangladesh customs clearance, duty-tax, port/airport handling, delivery এবং last-mile delivery—কোনগুলো আছে? Product restriction বা special handling charge আছে কি? Weight actual, volumetric, নাকি chargeable weight—কোন basis-এ? Minimum charge কত?"}, {"t": "h", "x": "১৯.৬ Product Restriction ও Cargo Description"}, {"t": "p", "x": "“General goods” বা “mixed items” বলে সব পণ্য পাঠানো যাবে না। Battery, liquid, cosmetics, food, branded goods, electronics, chemical, magnet, medicine বা wireless device-এর আলাদা restriction থাকতে পারে। Forwarder-কে পণ্যের ছবি, description, quantity ও composition সত্যভাবে দিন। কোনো restricted item লুকিয়ে পাঠানো হলে পুরো shipment আটকে যেতে পারে।"}, {"t": "h", "x": "১৯.৭ Commercial Import ও Informal Cargo Channel"}, {"t": "p", "x": "কিছু service provider ছোট shipment-এর জন্য consolidated বা special logistics service অফার করতে পারে। কিন্তু service provider-এর “আমরা সব clear করে দেব” বক্তব্যের ভিত্তিতে legality ধরে নেওয়া যাবে না। কে importer of record, কোন declaration-এ cargo যাচ্ছে, duty-tax কীভাবে পরিশোধ হচ্ছে, receipt পাওয়া যাবে কি না এবং পণ্য আইনত আমদানিযোগ্য কি না—এসব জানতে হবে। অস্বচ্ছ channel-এ shipment পাঠালে cargo loss, seizure, no-document delivery এবং dispute risk থাকে।"}, {"t": "h", "x": "১৯.৮ Customer Order Model-এর Cash-flow"}, {"t": "p", "x": "Customer-এর কাছ থেকে আগাম টাকা নিয়ে পরে পণ্য order করলে supplier price, China domestic delivery, warehouse, international freight, customs duty-tax, local delivery, currency fluctuation এবং refund/return risk হিসাব করতে হবে। ETA ১৫–৩০ দিন বলা হলেও এটি নিশ্চিত guarantee নয়; supplier delay, consolidation schedule, customs এবং transport disruption-এ সময় বাড়তে পারে। Customer-কে realistic delivery window ও delay policy জানাতে হবে।"}]}, {"id": "c20", "title": "অধ্যায় ২০ — IMPORT COSTING, LANDED COST ও OPERATIONAL CONTROL", "blocks": [{"t": "h", "x": "২০.১ Landed Cost কী"}, {"t": "p", "x": "Landed Cost হলো পণ্য buyer-এর নির্ধারিত destination/warehouse-এ পৌঁছানো পর্যন্ত সংশ্লিষ্ট সব cost-এর সমন্বিত হিসাব। এটি শুধু supplier invoice price নয়। পণ্যের প্রকৃত business cost বুঝতে landed cost হিসাব করা জরুরি।"}, {"t": "h", "x": "২০.২ Landed Cost-এর সাধারণ উপাদান"}, {"t": "ul", "x": ["Product purchase price.", "China domestic transport বা supplier pickup.", "Origin warehouse receiving/handling.", "Inspection, repacking ও consolidation.", "Export documentation/clearance.", "International freight.", "Cargo insurance.", "Destination local charges.", "Customs duty ও applicable taxes.", "C&F Agent service fee.", "Port/terminal/CFS/warehouse charge.", "Inland transport ও unloading.", "Bank/payment/foreign exchange cost.", "Delay-related storage, demurrage বা detention.", "Damage, shortage ও return allowance."]}, {"t": "p", "x": "সব item প্রতিটি shipment-এ প্রযোজ্য নয়। Quotation-এর scope অনুযায়ী যোগ বা বাদ দিতে হবে।"}, {"t": "h", "x": "২০.৩ প্রতি ইউনিট Landed Cost"}, {"t": "p", "x": "মোট landed cost-কে saleable unit-এর সংখ্যা দিয়ে ভাগ করলে unit landed cost পাওয়া যায়। কিন্তু damaged/defective item, sample, spare, packaging এবং non-saleable unit থাকলে denominator ঠিক করতে হবে। একটি shipment-এ ১,০০০ unit এসেছে মানেই সব ১,০০০ unit বিক্রিযোগ্য—এমন নয়।"}, {"t": "h", "x": "২০.৪ Currency Risk"}, {"t": "p", "x": "Supplier USD, CNY বা অন্য currency-তে invoice দিতে পারেন। Bank exchange rate, remittance fee, card/payment provider charge এবং rate movement landed cost-এ প্রভাব ফেলে। Quotation তৈরির সময় কোন exchange rate ব্যবহার হয়েছে এবং কতদিন valid—তা নথিভুক্ত করুন।"}, {"t": "h", "x": "২০.৫ Cost Allocation"}, {"t": "p", "x": "একাধিক SKU এক shipment-এ এলে freight ও common charge কীভাবে ভাগ করবেন তা আগে ঠিক করুন। Weight-based, volume-based, value-based বা unit-based allocation ব্যবহার করা যেতে পারে; কোন পদ্ধতি যুক্তিযুক্ত তা charge-এর প্রকৃতি অনুযায়ী নির্ধারণ করুন। সব cost সমানভাবে প্রতিটি SKU-তে ভাগ করলে ভুল unit economics হতে পারে।"}, {"t": "h", "x": "২০.৬ Shipment Control Sheet"}, {"t": "lead", "x": "প্রতিটি shipment-এর জন্য একটি control sheet রাখুন:"}, {"t": "ul", "x": ["Shipment ID ও internal order reference.", "Supplier ও origin warehouse.", "Product/SKU ও package count.", "Invoice value ও payment status.", "Cargo ready, warehouse received ও departure date.", "Vessel/flight, B/L/AWB ও container reference.", "ETA ও actual arrival.", "Customs declaration/assessment reference.", "Duty-tax payment status.", "Carrier/terminal release status.", "Delivery date ও received quantity.", "Total cost ও variance.", "Damage/shortage/claim status."]}, {"t": "h", "x": "২০.৭ Estimated বনাম Actual Cost"}, {"t": "p", "x": "Shipment শুরুর সময় estimated cost এবং শেষে actual cost তুলনা করুন। Variance কেন হলো—freight rate change, weight discrepancy, extra handling, customs reassessment, storage, demurrage, exchange rate, agent charge, নাকি delivery change—কারণ আলাদা করে লিখুন। কয়েকটি shipment-এর data জমলে supplier, Forwarder, C&F Agent ও route তুলনা করা সহজ হবে।"}]}, {"id": "c21", "title": "অধ্যায় ২১ — একটি বাস্তবধর্মী IMPORT SHIPMENT-এর পূর্ণ CASE STUDY", "blocks": [{"t": "p", "x": "এই case study-তে একটি কাল্পনিক বাংলাদেশি ব্যবসা চীন থেকে non-restricted সাধারণ household accessory আমদানি করছে বলে ধরা হয়েছে। পণ্য ও সংখ্যা কেবল শেখানোর জন্য; বাস্তবে HS Code, duty, permit এবং charge আলাদাভাবে যাচাই করতে হবে।"}, {"t": "step", "x": "ধাপ ১: Product selection"}, {"t": "p", "x": "Importer supplier-এর কাছ থেকে product photo, material, size, model, function, carton packing, unit quantity ও quotation নেয়। তিনি product legality এবং সম্ভাব্য HS Code যাচাইয়ের জন্য C&F Agent-কে specification পাঠান।"}, {"t": "step", "x": "ধাপ ২: Supplier verification ও order"}, {"t": "p", "x": "Supplier-এর business identity, sample quality, production capacity এবং payment details যাচাই করা হয়। PI ও PO-তে product description, quantity, unit price, currency, packaging, delivery term এবং lead time উল্লেখ থাকে। Payment bank বা অনুমোদিত channel দিয়ে করা হয়।"}, {"t": "step", "x": "ধাপ ৩: Freight planning"}, {"t": "p", "x": "Cargo-এর মোট package, gross weight, dimensions এবং cargo ready date Forwarder-কে দেওয়া হয়। Forwarder LCL sea freight ও air freight-এর quote দেয়। Importer total door-to-door cost, transit time এবং inventory urgency তুলনা করে sea freight বেছে নেয়।"}, {"t": "step", "x": "ধাপ ৪: China warehouse receiving"}, {"t": "p", "x": "Supplier cargo China warehouse-এ পাঠায়। Warehouse package count, weight ও dimension record করে। Importer receiving report ও ছবি পায়। একটি carton-এর label ভুল থাকায় warehouse package identify করতে পারে না; supplier-এর সঙ্গে মিলিয়ে label সংশোধন করা হয়।"}, {"t": "step", "x": "ধাপ ৫: Export ও consolidation"}, {"t": "p", "x": "Forwarder অন্য cargo-র সঙ্গে LCL consolidation করে। Export documentation এবং carrier booking সম্পন্ন হয়। Importer final packing list ও shipment reference সংগ্রহ করে।"}, {"t": "step", "x": "ধাপ ৬: Shipment departure"}, {"t": "p", "x": "Cargo vessel-এ load হয় এবং B/L draft পাঠানো হয়। Importer shipper, consignee, notify party, description, package count ও weight যাচাই করে। ভুল
